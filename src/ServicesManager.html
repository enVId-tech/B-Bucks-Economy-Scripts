    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Manager</title>

<body>
    <!-- Navigation Header -->
    <div class="nav-header">
        <button class="nav-link" onclick="callServer('openManualBalanceManager')">💰 Manual B-Bucks
            Modifier</button>
        <button class="nav-link active" onclick="callServer('openIncomesExpenses')">💸 Income / Expenses</button>
        <button class="nav-link" onclick="callServer('openInvestmentsManager')">📈 Investment
            Banking</button>
        <button class="nav-link" onclick="callServer('openTransactionsRecords')">📊 Transaction
            Records</button>
        <button class="nav-link" onclick="callServer('openHistoricalAnalytics')">📉 Historical Analytics</button>
        <button class="nav-link" onclick="callServer('openBankingSettings')">⚙️ Banking Settings</button>
    </div>

    <div class="main-content">
        <!-- LEFT PANEL: Controls -->
        <div class="controls">
            <div class="sheet-switcher">
                <select id="sheetSelect" onchange="switchActiveSheet()">
                    <option value="">Loading sheets...</option>
                </select>
            </div>

            <div class="loading-indicator" id="loadingIndicator">
                <div class="loading-spinner"></div>
                <span>Loading...</span>
            </div>

            <!-- CARD 1: INCOME SECTION -->
            <div class="card">
                <div class="header-title header-title-reset">💰 Add Income</div>
                <div class="header-subtitle header-subtitle-margin">Earnable items to Column D</div>

                <label class="label">Quarter</label>
                <select id="quarterSelectIncome" onchange="updateIncomes()">
                    <option value="Q1">Quarter 1</option>
                    <option value="Q2">Quarter 2</option>
                    <option value="Q3">Quarter 3</option>
                    <option value="Q4">Quarter 4</option>
                </select>

                <div class="loading-indicator" id="loadingIndicatorIncome">
                    <div class="loading-spinner"></div>
                    <span>Loading...</span>
                </div>

                <label class="label">Item</label>
                <select id="itemSelectIncome" onchange="updatePreview()">
                    <option value="">Select an item...</option>
                </select>

                <label class="label">Quantity</label>
                <input type="number" id="multiplierIncome" value="1" min="1" oninput="updatePreview()">

                <!-- Max/Person: how many of this item the selected people may still buy this quarter -->
                <div id="limitStatusIncome" class="limit-status display-none"></div>

                <div class="toggle-container toggle-margin-4">
                    <input type="checkbox" id="restrictionOverrideIncome">
                    <label class="toggle-label" for="restrictionOverrideIncome">Override Restrictions</label>
                </div>

                <div class="preview-container">
                    <div class="preview-text" id="previewIncome">--</div>
                </div>

                <button class="btn-submit btn-income margin-top-4" id="submitIncomeBtn" onclick="submitIncome()">Add
                    Income</button>

                <div class="loading-indicator" id="applyingIndicatorIncome">
                    <div class="loading-spinner"></div>
                    <span>Applying income...</span>
                </div>
            </div>

            <!-- CARD 2: SPENDING SECTION -->
            <div class="card card-margin-top-6">
                <div class="header-title header-title-reset">💸 Add Expense</div>
                <div class="header-subtitle header-subtitle-margin">Consumable items to Column G</div>

                <label class="label">Quarter</label>
                <select id="quarterSelectSpending" onchange="updateExpenses()">
                    <option value="Q1">Quarter 1</option>
                    <option value="Q2">Quarter 2</option>
                    <option value="Q3">Quarter 3</option>
                    <option value="Q4">Quarter 4</option>
                </select>

                <div class="loading-indicator" id="loadingIndicatorSpending">
                    <div class="loading-spinner"></div>
                    <span>Loading...</span>
                </div>

                <label class="label">Item</label>
                <select id="itemSelectSpending" onchange="updatePreview()">
                    <option value="">Select an item...</option>
                </select>

                <label class="label">Quantity</label>
                <input type="number" id="multiplierSpending" value="1" min="1" oninput="updatePreview()">

                <!-- Insufficient Funds Warning -->
                <div id="insufficientWarning" class="insufficient-warning hidden-display">
                    ⚠️ Insufficient funds! Enable Override Restrictions to proceed.
                </div>

                <!-- Override Toggle -->
                <!-- Max/Person: how many of this item the selected people may still buy this quarter -->
                <div id="limitStatusSpending" class="limit-status display-none"></div>

                <div class="toggle-container toggle-margin-4">
                    <input type="checkbox" id="restrictionOverrideSpending">
                    <label class="toggle-label" for="restrictionOverrideSpending">Override Restrictions</label>
                </div>

                <div class="preview-container">
                    <div class="preview-text" id="previewSpending">--</div>
                </div>

                <button class="btn-submit btn-spending margin-top-4" id="submitSpendingBtn"
                    onclick="submitSpending()">Add
                    Expense</button>

                <div class="loading-indicator" id="applyingIndicatorSpending">
                    <div class="loading-spinner"></div>
                    <span>Applying expense...</span>
                </div>

                <div class="auto-refresh-indicator" id="refreshIndicator">● Auto-refreshing</div>
                <div id="errorContainer"></div>
            </div>

        </div>

        <!-- RIGHT PANEL: Activity Log -->
        <div class="log-panel">
            <div class="log-header">Activity Log</div>

            <!-- Search & Filter Controls -->
            <div class="action-bar">
                <div class="action-bar-section">
                    <label class="action-bar-label">Search
                        Name</label>
                    <input type="text" id="logSearchName" placeholder="Search by name..." class="action-bar-input">
                </div>
                <div class="action-bar-section">
                    <label class="action-bar-label">Transaction
                        Date</label>
                    <input type="date" id="logFilterDate" class="action-bar-input">
                </div>
            </div>

            <!-- Undo Action Bar -->
            <div class="log-action-bar">
                <button class="btn-undo-selected" id="undoSelectedBtn" onclick="undoSelectedTransactions()" disabled>↶
                    Undo</button>

                <div class="action-bar-section">
                    <label class="action-bar-label">Page</label>
                    <input type="number" id="logPage" value="1" min="1" class="action-bar-input"
                        oninput="applyTransactionFilters()" onchange="applyTransactionFilters()">
                </div>
                <div class="action-bar-section">
                    <label class="action-bar-label">Displayed</label>
                    <input type="number" id="logLimit" value="25" min="1" class="action-bar-input"
                        oninput="applyTransactionFilters()" onchange="applyTransactionFilters()">
                </div>
            </div>

            <div class="loading-indicator" id="loadingIndicatorTransactions">
                <div class="loading-spinner"></div>
                <span>Loading transactions...</span>
            </div>

            <div id="log-container"></div>
        </div>
    </div>

    <script>

        // Execute as soon as the DOM frame paints to configure UI components
        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('logSearchName').addEventListener('input', applyTransactionFilters);
            document.getElementById('logFilterDate').addEventListener('change', applyTransactionFilters);
            setElementDisplay(document.getElementById("loadingIndicatorTransactions"), 'flex'); // Show loading indicator

            // Remember when the admin picks a quarter themselves, so the automatic updates never fight them.
            document.getElementById('quarterSelectIncome').addEventListener('change', () => { quarterManuallyChosen.Income = true; });
            document.getElementById('quarterSelectSpending').addEventListener('change', () => { quarterManuallyChosen.Spending = true; });

            // These three requests do not depend on each other, so they all start right away instead of one after another:
            //   1. the transaction log (own server call, own loading indicator)
            //   2. the services sheet names for the sheet drop-down
            //   3. today's quarter AND the services price list (the lists need both, but neither needs the other)
            loadTransactionData(false);
            loadServicesSheetOptions();
            const servicesPrefetch = fetchClientData('cachedServices', 'fetchServicesDataCached', false, ["servicesSheet", null])
                .catch((e) => { console.warn('Services prefetch failed, populateLists will retry:', e); });
            await Promise.all([autoConfigureCurrentQuarter(), servicesPrefetch]);
            startQuarterWatcher();
            // Served from the in-memory layer filled by the prefetch above
            await populateLists(null, false, null);
        });

        document.addEventListener('click', () => {
            if (event.target === document.body || event.target === document.documentElement) {
                document.querySelectorAll('[data-selectable="true"].selected').forEach(item => {
                    item.classList.remove('selected');
                });
                updateUndoButtonState();
            }
        });

        /** Updates the income and spending preview boxes based on current selections and quantities. */
        function updatePreview() {
            try {
                const incomeSelect = document.getElementById('itemSelectIncome');
                const spendingSelect = document.getElementById('itemSelectSpending');

                // Use unary plus (+) for faster, cleaner integer conversions than parseInt
                const multiplierIncome = +document.getElementById('multiplierIncome').value || 1;
                const multiplierSpending = +document.getElementById('multiplierSpending').value || 1;

                const previewIncome = document.getElementById('previewIncome');
                const previewSpending = document.getElementById('previewSpending');

                const selectedIncomeOption = incomeSelect.options[incomeSelect.selectedIndex];
                const selectedSpendingOption = spendingSelect.options[spendingSelect.selectedIndex];

                const incomePrice = selectedIncomeOption && selectedIncomeOption.value ? +selectedIncomeOption.getAttribute('data-price') || 0 : 0;
                const spendingPrice = selectedSpendingOption && selectedSpendingOption.value ? +selectedSpendingOption.getAttribute('data-price') || 0 : 0;

                if (incomeSelect.value && incomePrice >= 0 && multiplierIncome > 0) {
                    previewIncome.textContent = `Item: ${incomeSelect.value} | Base: $${incomePrice} x ${multiplierIncome} = +$${(incomePrice * multiplierIncome)}`;
                } else {
                    previewIncome.textContent = '--';
                }

                if (spendingSelect.value && spendingPrice >= 0 && multiplierSpending > 0) {
                    previewSpending.textContent = `Item: ${spendingSelect.value} | Base: $${spendingPrice} x ${multiplierSpending} = -$${(spendingPrice * multiplierSpending)}`;
                } else {
                    previewSpending.textContent = '--';
                }
                refreshLimitStatus('Income');
                refreshLimitStatus('Spending');
            } catch (error) {
                console.error("Error updating preview:", error);
            }
        }

        // ---- Max/Person: "how many are left" for the people selected in the sheet ----
        const limitRequestInFlight = { Income: false, Spending: false };
        const LIMIT_STATUS_POLL_MS = 4000;
        const LIMIT_STATUS_MAX_NAMES = 4;

        /** Asks the server how many purchases of the chosen item each selected person has left this quarter. */
        function refreshLimitStatus(type) {
            const isIncome = type === 'Income';
            const itemSelect = document.getElementById(isIncome ? 'itemSelectIncome' : 'itemSelectSpending');
            const quarterSelect = document.getElementById(isIncome ? 'quarterSelectIncome' : 'quarterSelectSpending');
            const statusBox = document.getElementById(isIncome ? 'limitStatusIncome' : 'limitStatusSpending');
            if (!itemSelect || !quarterSelect || !statusBox) return;

            const selectedOption = itemSelect.options[itemSelect.selectedIndex];
            const hasCap = selectedOption && selectedOption.value
                && (selectedOption.getAttribute('data-limit') || selectedOption.getAttribute('data-class-limit'));
            if (!hasCap) {
                setElementDisplay(statusBox, 'none');
                return;
            }
            if (limitRequestInFlight[type]) return;
            limitRequestInFlight[type] = true;

            const quantity = +document.getElementById(isIncome ? 'multiplierIncome' : 'multiplierSpending').value || 1;
            callServer('fetchServiceLimitStatus', JSON.stringify({ itemName: itemSelect.value, quarter: quarterSelect.value }), (report) => {
                limitRequestInFlight[type] = false;
                renderLimitStatus(statusBox, report, quantity);
            }, (error) => {
                limitRequestInFlight[type] = false;
                console.error('Could not load the Max/Person status:', error);
            });
        }

        /** Draws the "left" line(s) for the selected people and classes, in red when the chosen quantity would go over. */
        function renderLimitStatus(statusBox, report, quantity) {
            const hasPersonLimit = report && report.limit !== null && report.limit !== undefined;
            const hasClassLimit = report && report.classLimit !== null && report.classLimit !== undefined;
            if (!report || report.error || (!hasPersonLimit && !hasClassLimit)) {
                setElementDisplay(statusBox, 'none');
                return;
            }

            const lines = [];
            let isOverLimit = false;

            if (hasPersonLimit) {
                if (!report.people || report.people.length === 0) {
                    lines.push(`Max ${report.limit} per person this quarter. Select a student in the sheet to see how many are left.`);
                } else {
                    const sortedPeople = report.people.slice().sort((a, b) => a.remaining - b.remaining);
                    const shownPeople = sortedPeople.slice(0, LIMIT_STATUS_MAX_NAMES);
                    shownPeople.forEach(person => lines.push(`${person.individual}: ${person.remaining} of ${person.limit} left`));
                    if (sortedPeople.length > shownPeople.length) {
                        lines.push(`+${sortedPeople.length - shownPeople.length} more selected`);
                    }
                    if (sortedPeople.some(person => quantity > person.remaining)) isOverLimit = true;
                }
            }

            if (hasClassLimit) {
                if (!report.classes || report.classes.length === 0) {
                    lines.push(`Max ${report.classLimit} per class this quarter.`);
                } else {
                    report.classes.forEach(classStatus => {
                        lines.push(`Period ${classStatus.period}: ${classStatus.remaining} of ${classStatus.limit} left for the class`);
                        if (quantity * classStatus.selectedStudents > classStatus.remaining) isOverLimit = true;
                    });
                }
            }

            if (!report.enforced) {
                lines.push('(limits are switched off in Settings)');
            }

            statusBox.textContent = lines.join('\n');
            statusBox.classList.toggle('limit-status-exhausted', isOverLimit);
            setElementDisplay(statusBox, 'block');
        }

        setInterval(() => {
            // No server calls while the dialog is hidden behind another tab/window.
            if (document.hidden) return;
            refreshLimitStatus('Income');
            refreshLimitStatus('Spending');
        }, LIMIT_STATUS_POLL_MS);

        function normalizeFilterText(value) {
            return String(value ?? '').toLowerCase().trim();
        }

        function renderTransactionLog(transactions) {
            const logContainer = document.getElementById('log-container');

            if (!transactions.length) {
                logContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔎</div>
                        <div>No transactions match the current filters.</div>
                    </div>
                `;
                updateUndoButtonState();
                setElementDisplay(document.getElementById('loadingIndicatorTransactions'), 'none');
                return;
            }

            let htmlContent = '';

            // The server already returned exactly this page, newest first.
            const paginatedTransactions = transactions;

            // Render the page's slice
            paginatedTransactions.forEach(transaction => {
                const {
                    id,
                    individual,
                    period,
                    modifiedColumn,
                    serviceProvided,
                    initialColumnAmount,
                    newColumnAmount,
                    initialBalance,
                    newBalance,
                    timestamp
                } = transaction;

                const balanceDelta = Number((newBalance - initialBalance).toFixed(2));
                const balanceDeltaClass = balanceDelta < 0 ? 'negative' : balanceDelta > 0 ? 'positive' : 'static';
                const balanceDeltaSymbol = balanceDelta < 0 ? '-' : '+';

                const columnDelta = Number((newColumnAmount - initialColumnAmount).toFixed(2));
                const columnDeltaClass = columnDelta < 0 ? 'negative' : columnDelta > 0 ? 'positive' : 'static';
                const columnDeltaSymbol = columnDelta < 0 ? '-' : '+';

                const mathBalanceOperationElement = `
                    <span ${initialBalance < 0 ? 'class="negative"' : ''}>$${initialBalance}</span>
                    <span class="${balanceDeltaClass}">${balanceDeltaSymbol}</span>
                    <span class="${balanceDeltaClass}">$${Number(Math.abs(balanceDelta).toFixed(2))}</span> =
                    <span ${newBalance < 0 ? 'class="negative"' : ''}>$${newBalance}</span>
                `;

                const mathColumnOperationElement = `
                    <span ${initialColumnAmount < 0 ? 'class="negative"' : ''}>$${initialColumnAmount}</span>
                    <span class="${columnDeltaClass}">${columnDeltaSymbol}</span>
                    <span class="${columnDeltaClass}">$${Number(Math.abs(columnDelta).toFixed(2))}</span> =
                    <span ${newColumnAmount < 0 ? 'class="negative"' : ''}>$${newColumnAmount}</span>
                `;

                htmlContent += `
                    <div class="log-item" data-selectable="true" onclick="this.classList.toggle('selected'); updateUndoButtonState();">
                        <div class="log-item-content">
                            <div class="log-item-header">
                                <span class="log-item-name">${individual}</span>
                                <span class="log-item-period">Period ${period}</span>
                            </div>
                            <div class="log-item-type">
                                <p class="log-item-type-label log-item-timestamp">${new Date(timestamp).toLocaleString()}</p>
                            </div>
                            <div class="log-item-type">
                                <p class="log-item-type-label log-item-id">TXN#${id}</p>
                            </div>
                            <div class="log-item-service">
                                <p class="log-item-service-label">Service</p>
                                <p class="log-item-service-value">${serviceProvided}</p>
                            </div>
                            <div class="log-item-math">
                                <p class="log-item-math-label">Balance</p>
                                ${mathBalanceOperationElement}
                            </div>
                            <div class="log-item-math">
                                <p class="log-item-math-label">Col ${modifiedColumn}</p>
                                ${mathColumnOperationElement}
                            </div>
                        </div>
                    </div>
                `;
            });

            logContainer.innerHTML = htmlContent;
            updateUndoButtonState();
            setElementDisplay(document.getElementById('loadingIndicatorTransactions'), 'none');
        }

        // ---- Rolling transaction log: only a window of pages is ever held in memory (see utils/TransactionWindow.html) ----
        const txLog = new RollingTransactionLog();
        let applyFiltersTimer = null;
        let renderToken = 0;

        /** Server-side filters for this panel's two inputs: name contains + a single day (in the admin's local time zone). */
        function getLogFilters() {
            const filters = {};
            const name = document.getElementById('logSearchName').value.trim();
            const day = document.getElementById('logFilterDate').value; // yyyy-mm-dd
            if (name) filters.studentContains = name;
            if (day) {
                const [year, month, date] = day.split('-').map(Number);
                filters.fromMs = new Date(year, month - 1, date).getTime();
                filters.toMs = new Date(year, month - 1, date + 1).getTime() - 1;
            }
            return filters;
        }

        /**
         * Re-reads the Page / Displayed / filter inputs and shows that page. Pages inside the in-memory window render instantly;
         * anything else is fetched, and the window then re-centres around the page in the background.
         * Debounced so typing in the inputs doesn't fire a request per keystroke.
         */
        function applyTransactionFilters() {
            clearTimeout(applyFiltersTimer);
            applyFiltersTimer = setTimeout(() => renderCurrentLogPage(false), 200);
        }

        async function renderCurrentLogPage(force = false) {
            const token = ++renderToken;
            const limitInput = document.getElementById('logLimit');
            const pageInput = document.getElementById('logPage');

            const limit = Math.max(1, Math.min(200, Number.parseInt(limitInput.value, 10) || 25));
            limitInput.value = limit;
            const page = Math.max(1, Number.parseInt(pageInput.value, 10) || 1);

            setElementDisplay(document.getElementById('loadingIndicatorTransactions'), 'flex');
            try {
                const result = await txLog.getPage({ page, pageSize: limit, filters: getLogFilters(), force });
                if (token !== renderToken) return; // a newer request superseded this one

                pageInput.value = result.page; // the server clamps pages past the end
                pageInput.setAttribute('max', result.totalPages);
                renderTransactionLog(result.records);
            } catch (error) {
                if (token !== renderToken) return;
                console.error('Error fetching transaction data:', error);
                setElementDisplay(document.getElementById('loadingIndicatorTransactions'), 'none');
            }
        }

        /**
         * Fetches the current page of the transaction log and renders it.
         * @param {boolean} refresh - true after the log changed (new transaction, undo): drops the in-memory window so the page is re-read.
         */
        function loadTransactionData(refresh = true) {
            if (refresh) txLog.invalidate();
            document.getElementById('log-container').innerHTML = '';
            renderCurrentLogPage(false);
        }

        async function addBalance(type = null) {
            try {
                if (!type || (type !== 'Income' && type !== 'Spending')) {
                    alert("Invalid operation type. Must be 'Income' or 'Spending'.");
                    console.error("addBalance called with invalid type:", type);
                    return;
                }

                // Standardized lookups based on context branch
                const isIncome = type === "Income";
                const selectId = isIncome ? 'itemSelectIncome' : 'itemSelectSpending';
                const multiplierId = isIncome ? 'multiplierIncome' : 'multiplierSpending';

                if (isIncome) {
                    setElementDisplay(document.getElementById('applyingIndicatorIncome'), 'flex'); // Show applying indicator
                } else {
                    setElementDisplay(document.getElementById('applyingIndicatorSpending'), 'flex'); // Show applying indicator
                }

                const selectElement = document.getElementById(selectId);
                const name = selectElement ? selectElement.value : '';

                if (!name) {
                    alert("Please select an item before submitting.");
                    console.error("No item selected for type:", type);
                    return;
                }

                const multiplier = +document.getElementById(multiplierId).value || 1;

                // Dynamic option attribute extraction targeting the correct context element
                const selectedOption = selectElement.options[selectElement.selectedIndex];
                const price = selectedOption ? +selectedOption.getAttribute('data-price') || 0 : 0;

                let payload = {
                    operation: isIncome ? "ADD" : "SUBTRACT",
                    unitPrice: price || undefined,
                    quantity: multiplier || undefined,
                    amount: price * (multiplier > 0 ? multiplier : 1) * (isIncome ? 1 : -1),
                    transactionReason: `$${price} - ${name} (x${multiplier})`,
                    itemName: name,
                    quarter: document.getElementById(isIncome ? 'quarterSelectIncome' : 'quarterSelectSpending').value,
                    isRestrictionOverride: document.getElementById(isIncome ? 'restrictionOverrideIncome' : 'restrictionOverrideSpending').checked
                };

                // The buttons stay disabled until the server answers. Re-enabling them right after the (asynchronous) call was
                // sent let a second click charge the student twice.
                const finishSubmission = () => {
                    document.getElementById("submitIncomeBtn").disabled = false;
                    document.getElementById("submitSpendingBtn").disabled = false;
                    document.getElementById("submitIncomeBtn").classList.remove("disabled");
                    document.getElementById("submitSpendingBtn").classList.remove("disabled");
                    setElementDisplay(document.getElementById(isIncome ? 'applyingIndicatorIncome' : 'applyingIndicatorSpending'), 'none');
                };

                try {
                    document.getElementById("submitIncomeBtn").disabled = true;
                    document.getElementById("submitSpendingBtn").disabled = true;
                    document.getElementById("submitIncomeBtn").classList.add("disabled");
                    document.getElementById("submitSpendingBtn").classList.add("disabled");

                    // Forward payload securely to your backend execution router
                    callServer('executeServiceAction', JSON.stringify(payload), (response) => {
                        finishSubmission();
                        // The server answers "true" on success. Anything else is the reason it refused (a reached cap, not
                        // enough money...), which the server has already shown as a dialog, so it is not repeated here.
                        if (typeof response === 'string' && response !== 'true' && !response.startsWith('Mock')) {
                            console.warn(`Transaction refused: ${response}`);
                            refreshLimitStatus(type);
                            return;
                        }
                        refreshLimitStatus(type);

                        console.log(`Transaction successful: ${payload.transactionReason}`);
                        loadTransactionData(true); // Refresh the log after a successful transaction
                    }, (error) => {
                        finishSubmission();
                        console.error("Error executing balance action on server:", error);
                        alert(`Failed to execute transaction: ${error.message || error}`);
                    });
                } catch (error) {
                    finishSubmission();
                    console.error("Server execution exception on addBalance path:", error);
                    alert(`Failed to execute transaction: ${error.message}`);
                }
            } catch (error) {
                console.error("Unexpected parsing error in addBalance closure logic:", error);
            }
        }

        /** Submits the income form, validating inputs and then calling the server to process the transaction. */
        function submitIncome() {
            setElementDisplay(document.getElementById('loadingIndicatorTransactions'), 'flex'); // Show loading indicator
            setElementDisplay(document.getElementById('applyingIndicatorIncome'), 'flex'); // Show applying indicator
            addBalance('Income')
            setElementDisplay(document.getElementById('loadingIndicatorTransactions'), 'none'); // Hide loading indicator
            setElementDisplay(document.getElementById('applyingIndicatorIncome'), 'none'); // Hide applying indicator
        }

        /** Submits the spending form, validating inputs and then calling the server to process the transaction. */
        function submitSpending() {
            setElementDisplay(document.getElementById('loadingIndicatorTransactions'), 'flex'); // Show loading indicator
            setElementDisplay(document.getElementById('applyingIndicatorSpending'), 'flex'); // Show applying indicator
            addBalance('Spending')
            setElementDisplay(document.getElementById('loadingIndicatorTransactions'), 'none'); // Hide loading indicator
            setElementDisplay(document.getElementById('applyingIndicatorSpending'), 'none'); // Hide applying indicator
        }

        // Tracks whether the admin picked a quarter by hand. While true we never move that dropdown automatically.
        const quarterManuallyChosen = { Income: false, Spending: false };
        let activeQuarterId = null;
        let quarterWatcherStarted = false;

        const QUARTER_WORDS = ['One', 'Two', 'Three', 'Four'];

        function parseQuarterBoundary(value) {
            if (value === undefined || value === null || value === '') return null;
            const ms = value instanceof Date ? value.getTime() : (typeof value === 'number' ? value : Date.parse(String(value)));
            return Number.isFinite(ms) ? ms : null;
        }

        /**
         * Client-side mirror of resolveCurrentQuarter() in utils/QuarterUtils.ts. Only used as a fallback when the server
         * can't be reached. Keep the two in sync.
         * Accepts the real settings keys (startQ1Date) and the legacy ones (startQuarterOneDate).
         * @param {Object} dates - importantDates from the settings matrix.
         * @returns {string} "Q1" | "Q2" | "Q3" | "Q4"
         */
        function getCurrentQuarter(dates, nowMs = Date.now()) {
            const source = dates || {};
            const DAY = 24 * 60 * 60 * 1000;
            const quarters = [];

            for (let i = 0; i < 4; i++) {
                const start = parseQuarterBoundary(source[`startQ${i + 1}Date`]) ?? parseQuarterBoundary(source[`startQuarter${QUARTER_WORDS[i]}Date`]);
                let end = parseQuarterBoundary(source[`endQ${i + 1}Date`]) ?? parseQuarterBoundary(source[`endQuarter${QUARTER_WORDS[i]}Date`]);
                if (start === null) continue;
                // A plain date means "through the end of that day"
                if (end !== null && new Date(end).getHours() === 0 && new Date(end).getMinutes() === 0) end += DAY - 1;
                quarters.push({ id: `Q${i + 1}`, start, end });
            }

            if (!quarters.length) return 'Q1';

            const started = quarters.filter(q => q.start <= nowMs).sort((a, b) => a.start - b.start);
            if (!started.length) return quarters.slice().sort((a, b) => a.start - b.start)[0].id;

            // The most recently started quarter wins: it is active, or (during a break / after the year) stays selected.
            return started[started.length - 1].id;
        }

        /**
         * Which quarter is it right now? Asks the server (single source of truth, uses the spreadsheet's time zone) and
         * falls back to the cached settings if the call fails.
         * @returns {Promise<string>} "Q1" | "Q2" | "Q3" | "Q4"
         */
        async function getActiveQuarter(forceRefresh = false) {
            try {
                const info = await callServerAsync('getCurrentQuarterInfo');
                if (info && typeof info === 'object' && /^Q[1-4]$/.test(info.quarter)) {
                    return info.quarter;
                }
                console.warn('Unexpected quarter payload, using local fallback:', info);
            } catch (e) {
                console.warn('Server quarter lookup failed, using local fallback:', e);
            }

            const settings = await fetchClientData('cachedSettings', 'fetchSettingsDataCached', forceRefresh);
            return getCurrentQuarter(settings && settings.importantDates);
        }

        /**
         * Sets both quarter dropdowns to the quarter that matches today's date, leaving any dropdown the admin changed by hand alone.
         * @returns {Promise<boolean>} true if a dropdown actually changed (so lists need repopulating).
         */
        async function autoConfigureCurrentQuarter() {
            const expenseQuarterSelect = document.getElementById('quarterSelectSpending');
            const incomeQuarterSelect = document.getElementById('quarterSelectIncome');

            if (!expenseQuarterSelect || !incomeQuarterSelect) return false;

            try {
                const activeQuarter = await getActiveQuarter();
                const changed = activeQuarter !== activeQuarterId;
                activeQuarterId = activeQuarter;

                let touched = false;
                if (!quarterManuallyChosen.Spending && expenseQuarterSelect.value !== activeQuarter) {
                    expenseQuarterSelect.value = activeQuarter;
                    touched = true;
                }
                if (!quarterManuallyChosen.Income && incomeQuarterSelect.value !== activeQuarter) {
                    incomeQuarterSelect.value = activeQuarter;
                    touched = true;
                }

                if (changed) console.log(`Calendar bounds evaluated. Automatically localized to: ${activeQuarter}`);
                return touched;
            } catch (e) {
                console.error('Failed to auto-detect current active economic quarter:', e);
                return false;
            }
        }

        /**
         * Keeps the quarter in step with the calendar while the dialog stays open (it can sit open across a quarter boundary
         * or overnight): re-checks every 5 minutes and whenever the dialog regains focus.
         */
        function startQuarterWatcher() {
            if (quarterWatcherStarted) return;
            quarterWatcherStarted = true;

            const recheck = async () => {
                if (await autoConfigureCurrentQuarter()) {
                    await populateLists(null, false, null);
                }
            };

            setInterval(recheck, 5 * 60 * 1000);
            window.addEventListener('focus', recheck);
            document.addEventListener('visibilitychange', () => { if (!document.hidden) recheck(); });
        }

        /**
         * Populates both the Income and Expense item lists based on the selected quarter.
         */
        async function populateLists(targetType = null, forceRefresh = false, servicesSheet) {
            // Enable loading indicator for user feedback during async operations
            const loadingIndicator = document.getElementById('loadingIndicator');
            setElementDisplay(loadingIndicator, 'flex'); // Show loading indicator

            const quarterSelectSpending = document.getElementById('quarterSelectSpending');
            const quarterSelectIncome = document.getElementById('quarterSelectIncome');
            const incomeSelect = document.getElementById('itemSelectIncome');
            const expenseSelect = document.getElementById('itemSelectSpending');

            if (!quarterSelectSpending || !quarterSelectIncome) {
                console.error("One or more required DOM elements for populating item lists are missing.");
                return;
            }

            let sheetToSend = servicesSheet === null || servicesSheet === undefined ? null : servicesSheet;

            // Each list prices items using the quarter selected for that list (auto-set to today's quarter, or the admin's choice).
            const quarterIncome = quarterSelectIncome.value || activeQuarterId || await getActiveQuarter(forceRefresh);
            const quarterExpense = quarterSelectSpending.value || activeQuarterId || await getActiveQuarter(forceRefresh);
            const quarter = `Income: ${quarterIncome}, Expense: ${quarterExpense}`;

            try {
                const response = await fetchClientData('cachedServices', 'fetchServicesDataCached', forceRefresh, ["servicesSheet", servicesSheet]);

                console.log("Fetched services data for initial population:", response);

                if (!response || response.error) {
                    console.error("Error fetching services data:", response ? response.error : "Empty response");
                    return;
                }

                let incomeHtml = '<option value="">Select an item...</option>';
                let expenseHtml = '<option value="">Select an item...</option>';

                // Use for loop for optimal performance on larger datasets, minimizing DOM interactions and maximizing JS execution speed
                // Runs O(n) with minimal overhead
                for (let i = 0; i < response.length; i++) {
                    const item = response[i];

                    if (!item.itemName || !item.category) continue;
                    const itemQuarter = item.category === 'Income' ? quarterIncome : quarterExpense;
                    if (!item.pricing || item.pricing[itemQuarter] === undefined || item.pricing[itemQuarter] === null) continue;

                    const price = item.pricing[itemQuarter];
                    const personCap = item.limit && item.limit[itemQuarter] ? item.limit[itemQuarter] : '';
                    const classCap = item.classLimit && item.classLimit[itemQuarter] ? item.classLimit[itemQuarter] : '';
                    const limit = (personCap ? ` | Max: ${personCap}/person` : '') + (classCap ? ` | ${classCap}/class` : '');
                    const optionMarkup = `<option value="${item.itemName}" data-price="${price}" data-limit="${personCap}" data-class-limit="${classCap}">${item.itemName} ($${price})${limit}</option>`;

                    if (item.category === 'Income' && incomeSelect) {
                        incomeHtml += optionMarkup;
                    }

                    if (item.category === 'Expense' && expenseSelect) {
                        expenseHtml += optionMarkup;
                    }
                }

                // Batch flush the constructed HTML to the DOM in one operation per list for maximum efficiency
                if ((targetType === null || targetType === 'Income') && incomeSelect) {
                    incomeSelect.innerHTML = incomeHtml;
                }
                if ((targetType === null || targetType === 'Expense') && expenseSelect) {
                    expenseSelect.innerHTML = expenseHtml;
                }

                setElementDisplay(loadingIndicator, 'none'); // Hide loading indicator
                setElementDisplay(document.getElementById('applyingIndicatorIncome'), 'none'); // Hide loading indicator
                setElementDisplay(document.getElementById('applyingIndicatorSpending'), 'none'); // Hide loading indicator
                console.log(`Successfully populated income and expense lists with ${response.length} items from cache for quarter: ${quarter}`);
            } catch (error) {
                setElementDisplay(loadingIndicator, 'none'); // Ensure loading indicator is hidden on error
                console.error("Error populating item lists:", error);
            }
        }

        /**
          * Forces a network clear-through to refresh backend server arrays.
          */
        async function updateExpenses() {
            setElementDisplay(document.getElementById('applyingIndicatorSpending'), 'flex'); // Show loading indicator
            // Instant render from RAM for snappy UI response
            await populateLists('Expense');
            // Background round-trip updates look-aside engine safely
            await fetchClientData('cachedServices', 'fetchServicesDataCached', true);
            // Refresh with the verified backend values
            await populateLists('Expense');
            setElementDisplay(document.getElementById('applyingIndicatorSpending'), 'none'); // Hide loading indicator
        }

        async function updateIncomes() {
            setElementDisplay(document.getElementById('applyingIndicatorIncome'), 'flex'); // Show loading indicator
            // Instant render from RAM for snappy UI response
            await populateLists('Income');
            // Background round-trip updates look-aside engine safely
            await fetchClientData('cachedServices', 'fetchServicesDataCached', true);
            // Refresh with the verified backend values
            await populateLists('Income');
            setElementDisplay(document.getElementById('applyingIndicatorIncome'), 'none'); // Hide loading indicator
        }

        function updateUndoButtonState() {
            const undoBtn = document.getElementById('undoSelectedBtn');
            const selectedItems = document.querySelectorAll('[data-selectable="true"].selected');
            undoBtn.disabled = selectedItems.length === 0;
        }

        function undoSelectedTransactions() {
            const selectedItems = document.querySelectorAll('[data-selectable="true"].selected');
            if (selectedItems.length === 0) return;

            const transactionIds = Array.from(selectedItems).map(item => item.querySelector('.log-item-id').textContent.replace('TXN#', ''));

            console.log("Undoing Transactions:", transactionIds);

            callServer('undoTransactions', JSON.stringify({ transactionIds }), (response) => {
                if (response) {
                    console.log("Successfully undone transactions:", transactionIds);
                    // Refresh the log after undoing
                    loadTransactionData();
                } else {
                    console.error("Failed to undo transactions:", response.error);
                }
            }, (error) => {
                console.error("Error undoing transactions:", error);
            });
        }

        /**
         * Fetches the names of all sheets in the active spreadsheet that contain the word "services" in their name and populates the services sheet dropdown.
         */
        function loadServicesSheetOptions() {
            callServer('fetchServicesSheetNames', null, (response) => {
                const sheetSelect = document.getElementById('sheetSelect');
                if (!sheetSelect) {
                    console.error("Sheet select element not found in DOM.");
                    return;
                }

                // Remove the loading option and populate with actual sheet names
                sheetSelect.innerHTML = '';

                if (response && Array.isArray(response) && response.length > 0) {
                    response.forEach(sheetName => {
                        const option = document.createElement('option');
                        option.value = sheetName;
                        option.textContent = sheetName;
                        sheetSelect.appendChild(option);
                    });
                } else {
                    const option = document.createElement('option');
                    option.value = '';
                    option.textContent = 'No services sheets found';
                    sheetSelect.appendChild(option);
                }
            }, (error) => {
                console.error("Error fetching services sheet names:", error);
            });
        }

        function switchActiveSheet() {
            const sheetSelect = document.getElementById('sheetSelect');
            if (!sheetSelect) {
                console.error("Sheet select element not found in DOM.");
                return;
            }

            const selectedSheet = sheetSelect.value;
            if (!selectedSheet) {
                console.warn("No sheet selected for switching.");
                return;
            }

            console.log(`Switching active services sheet to: ${selectedSheet}`);
            // Refresh the lists with the newly selected sheet
            populateLists(null, true, selectedSheet);
        }
    </script>
