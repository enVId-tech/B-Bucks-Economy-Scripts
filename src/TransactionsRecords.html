<!-- This file contains the HTML structure for the Transactions Records, which allows users to view and manage their transaction history, including filtering, searching, and exporting options. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions Records</title>

    <!-- For contributors: Ignore these warning, this is a syntax issue with VSC not recognizing the server-side templating -->
    <!-- These lines MUST be included for the application to function correctly -->
    <?!= include('styles/TransactionsRecords'); ?>

    <!-- Include Client-to-Server HTML Utility to neatly transfer data between client and server through a JSON string -->
    <?!= include('utils/ClientToServer'); ?>
</head>

<body>
    <!-- Navigation Header -->
    <div class="nav-header">
        <button class="nav-link" onclick="callServer('openManualBalanceManager')">💰 Manual B-Bucks
            Modifier</button>
        <button class="nav-link" onclick="callServer('openIncomesExpenses')">💸 Income / Expenses</button>
        <button class="nav-link" onclick="callServer('openInvestmentsManager')">📈 Investment
            Banking</button>
        <button class="nav-link active" onclick="callServer('openTransactionsRecords')">📊 Transaction
            Records</button>
        <button class="nav-link" onclick="callServer('openBankingSettings')">⚙️ Banking Settings</button>
    </div>

    <div class="main-content">
        <!-- Header -->
        <div class="header">
            <h1 class="header-title">📊 Transaction Records</h1>
            <p class="header-subtitle">View all B-Bucks transactions and activity logs</p>
        </div>

        <!-- Controls & Filters -->
        <div class="controls">
            <div class="control-group control-group-search">
                <label>Search</label>
                <input type="text" id="filterSearch" placeholder="Search records">
            </div>

            <div class="control-group control-group-scope">
                <label>Scope</label>
                <select id="filterScope">
                    <option value="all">All Fields</option>
                    <option value="student">Student</option>
                    <option value="item">Item</option>
                    <option value="type">Type</option>
                    <option value="period">Period</option>
                    <option value="id">Transaction ID</option>
                    <option value="column">Column</option>
                </select>
            </div>

            <div class="control-group">
                <label>Period</label>
                <select id="filterPeriod">
                    <option value="">All Periods</option>
                    <option value="1">Period 1</option>
                    <option value="2">Period 2</option>
                    <option value="3">Period 3</option>
                    <option value="4">Period 4</option>
                </select>
            </div>

            <div class="control-group control-group-flex">
                <label>Student</label>
                <select id="filterStudent">
                    <option value="">All Students</option>
                </select>
            </div>

            <div class="control-group">
                <label>Type</label>
                <select id="filterType">
                    <option value="">All Types</option>
                    <option value="income">Income</option>
                    <option value="spending">Spending</option>
                    <option value="deposit">Deposit</option>
                    <option value="withdraw">Withdraw</option>
                </select>
            </div>

            <div class="control-group">
                <label>From Date</label>
                <input type="date" id="filterFromDate">
            </div>

            <div class="control-group">
                <label>To Date</label>
                <input type="date" id="filterToDate">
            </div>

            <button class="btn-filter" id="applyFilterBtn">Filter</button>
            <button class="btn-clear" id="clearFilterBtn">Clear</button>
        </div>

        <!-- Statistics Bar -->
        <div class="stats-bar">
            <div class="stat">
                <div class="stat-label">Total</div>
                <div class="stat-value" id="totalCount">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Income</div>
                <div class="stat-value" id="incomeCount">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Spending</div>
                <div class="stat-value" id="spendingCount">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Net</div>
                <div class="stat-value" id="netAmount">$0.00</div>
            </div>
        </div>

        <!-- Action Bar -->
        <div class="log-action-bar">
            <button class="btn-undo-selected" id="undoSelectedBtn" onclick="undoSelectedTransactions()" disabled>Undo
                Selected</button>
        </div>

        <!-- Records Container -->
        <div class="records-container" id="recordsContainer"></div>
    </div>
    <script>
        let allTransactions = [];

        function updateUndoButtonState() {
            const undoBtn = document.getElementById('undoSelectedBtn');
            const selectedItems = document.querySelectorAll('[data-selectable="true"].selected');
            undoBtn.disabled = selectedItems.length === 0;
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('applyFilterBtn').addEventListener('click', applyTransactionFilters);
            document.getElementById('clearFilterBtn').addEventListener('click', clearTransactionFilters);

            document.getElementById('filterSearch').addEventListener('input', () => {
                applyTransactionFilters();
            });

            document.getElementById('filterScope').addEventListener('change', () => {
                applyTransactionFilters();
            });

            document.getElementById('filterPeriod').addEventListener('change', () => {
                applyTransactionFilters();
            });

            document.getElementById('filterStudent').addEventListener('change', () => {
                applyTransactionFilters();
            });

            document.getElementById('filterType').addEventListener('change', () => {
                applyTransactionFilters();
            });

            document.getElementById('filterFromDate').addEventListener('change', () => {
                applyTransactionFilters();
            });

            document.getElementById('filterToDate').addEventListener('change', () => {
                applyTransactionFilters();
            });

            document.getElementById('recordsContainer').addEventListener('click', (event) => {
                const recordItem = event.target.closest('[data-selectable="true"]');
                if (!recordItem) return;

                event.stopPropagation();
                recordItem.classList.toggle('selected');
                updateUndoButtonState();
            });

            // Deselect all when clicking outside
            document.addEventListener('click', () => {
                if (event.target === document.body || event.target === document.documentElement) {
                    document.querySelectorAll('[data-selectable="true"].selected').forEach(item => {
                        item.classList.remove('selected');
                    });
                    updateUndoButtonState();
                }
            });

            loadTransactionData();
        });

        function normalizeText(value) {
            return String(value ?? '').toLowerCase().trim();
        }

        function getTransactionTypeLabel(type) {
            const typeMapping = {
                Income: 'income',
                Expense: 'spending',
                investment: 'deposit',
            };

            return typeMapping[type] || 'static';
        }

        function populateStudentFilterOptions(transactions) {
            const studentSelect = document.getElementById('filterStudent');
            const currentValue = studentSelect.value;
            const uniqueStudents = [...new Set(
                transactions
                    .map(transaction => String(transaction.individual || '').trim())
                    .filter(Boolean)
            )].sort((a, b) => a.localeCompare(b));

            studentSelect.innerHTML = '<option value="">All Students</option>';

            uniqueStudents.forEach(student => {
                const option = document.createElement('option');
                option.value = student;
                option.textContent = student;
                studentSelect.appendChild(option);
            });

            if (uniqueStudents.includes(currentValue)) {
                studentSelect.value = currentValue;
            }
        }

        function matchesSearch(transaction, scope, query) {
            if (!query) return true;

            const fields = {
                all: [
                    transaction.id,
                    transaction.individual,
                    transaction.period,
                    transaction.type,
                    transaction.serviceProvided,
                    transaction.unitPrice,
                    transaction.quantity,
                    transaction.modifiedColumn,
                    transaction.tenderedMoney,
                    transaction.timestamp,
                ],
                student: [transaction.individual],
                item: [transaction.serviceProvided],
                type: [transaction.type],
                period: [transaction.period],
                id: [transaction.id],
                column: [transaction.modifiedColumn],
            };

            const haystack = (fields[scope] || fields.all)
                .map(normalizeText)
                .join(' ');

            return haystack.includes(query);
        }

        function getFilteredTransactions() {
            const searchQuery = normalizeText(document.getElementById('filterSearch').value);
            const searchScope = document.getElementById('filterScope').value;
            const periodValue = document.getElementById('filterPeriod').value;
            const studentValue = normalizeText(document.getElementById('filterStudent').value);
            const typeValue = document.getElementById('filterType').value;
            const fromDateValue = document.getElementById('filterFromDate').value;
            const toDateValue = document.getElementById('filterToDate').value;

            return allTransactions.filter(transaction => {
                const transactionType = getTransactionTypeLabel(transaction.type);
                const transactionDate = transaction.timestamp ? new Date(transaction.timestamp) : null;

                if (periodValue && String(transaction.period) !== periodValue) return false;
                if (studentValue && normalizeText(transaction.individual) !== studentValue) return false;
                if (typeValue && transactionType !== typeValue) return false;
                if (fromDateValue && transactionDate && transactionDate < new Date(`${fromDateValue}T00:00:00`)) return false;
                if (toDateValue && transactionDate && transactionDate > new Date(`${toDateValue}T23:59:59.999`)) return false;
                if (!matchesSearch(transaction, searchScope, searchQuery)) return false;

                return true;
            });
        }

        function renderTransactionRecords(transactions) {
            const logContainer = document.getElementById('recordsContainer');

            if (!transactions.length) {
                logContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔎</div>
                        <div>No transactions match the current filters.</div>
                    </div>
                `;
                updateUndoButtonState();
                return;
            }

            let htmlContent = '';

            transactions.slice().reverse().forEach(transaction => {
                const { id, individual, period, type, serviceProvided, unitPrice, quantity, modifiedColumn, tenderedMoney, initialColumnAmount, newColumnAmount, initialBalance, newBalance, timestamp } = transaction;

                const balanceDelta = Number((newBalance - initialBalance).toFixed(2));
                const balanceDeltaClass = balanceDelta < 0 ? 'negative' : balanceDelta > 0 ? 'positive' : 'static';
                const balanceDeltaSymbol = balanceDelta < 0 ? '-' : '+';

                const columnDelta = Number((newColumnAmount - initialColumnAmount).toFixed(2));
                const columnDeltaClass = columnDelta < 0 ? 'negative' : columnDelta > 0 ? 'positive' : 'static';
                const columnDeltaSymbol = columnDelta < 0 ? '-' : '+';

                const mathBalanceOperationElement = `
                    <span class="record-formula-token ${initialBalance < 0 ? 'negative' : 'static'}">$${initialBalance}</span>
                    <span class="record-formula-symbol ${balanceDeltaClass}">${balanceDeltaSymbol}</span>
                    <span class="record-formula-token ${balanceDeltaClass}">$${Number(Math.abs(balanceDelta).toFixed(2))}</span>
                    <span class="record-formula-symbol static">=</span>
                    <span class="record-formula-token ${newBalance < 0 ? 'negative' : 'positive'}">$${newBalance}</span>
                `;

                const mathColumnOperationElement = `
                    <span class="record-formula-token ${initialColumnAmount < 0 ? 'negative' : 'static'}">$${initialColumnAmount}</span>
                    <span class="record-formula-symbol ${columnDeltaClass}">${columnDeltaSymbol}</span>
                    <span class="record-formula-token ${columnDeltaClass}">$${Number(Math.abs(columnDelta).toFixed(2))}</span>
                    <span class="record-formula-symbol static">=</span>
                    <span class="record-formula-token ${newColumnAmount < 0 ? 'negative' : 'positive'}">$${newColumnAmount}</span>
                `;

                const realTime = new Date(timestamp).toLocaleString();
                const typeMapping = {
                    Income: 'income',
                    Expense: 'spending',
                    investment: 'deposit',
                };

                htmlContent += `
                <div class="record-item ${typeMapping[type] || 'static'}" data-selectable="true">
                    <div class="record-item-content">
                        <div class="record-summary">
                            <div class="record-summary-left">
                                <span class="record-student">${individual}</span>
                                <span class="record-type ${typeMapping[type] || 'static'}">${type}</span>
                            </div>
                            <div class="record-top-meta">
                                <span class="record-meta-chip">Period ${period}</span>
                                <span class="record-meta-chip">#${id}</span>
                            </div>
                        </div>
                        <div class="record-highlight-row">
                            <div>
                                <span class="record-highlight-label">Date</span>
                                <span class="record-highlight-value">${realTime}</span>
                            </div>
                            <div>
                                <span class="record-highlight-label">Item</span>
                                <span class="record-highlight-value record-strong">${serviceProvided}</span>
                            </div>
                        </div>
                        <div class="record-details">
                            <div class="record-detail-item"><span class="record-detail-label">Column Modified:</span> <span class="record-detail-value record-strong">${modifiedColumn}</span></div>
                            <div class="record-detail-item"><span class="record-detail-label">Unit Price:</span> <span class="record-detail-value record-strong">$${unitPrice}</span></div>
                            <div class="record-detail-item"><span class="record-detail-label">Quantity:</span> <span class="record-detail-value record-strong">${quantity}</span></div>
                            <div class="record-detail-item"><span class="record-detail-label">Tendered Money:</span> <span class="record-detail-value record-strong">$${tenderedMoney}</span></div>
                            <div class="record-detail-item"><span class="record-detail-label">Column Delta:</span> <span class="record-detail-value ${columnDeltaClass}"><span class="record-formula">${mathColumnOperationElement}</span></span></div>
                            <div class="record-detail-item"><span class="record-detail-label">Balance Delta:</span> <span class="record-detail-value ${balanceDeltaClass}"><span class="record-formula">${mathBalanceOperationElement}</span></span></div>
                        </div>
                    </div>
                </div>
                `;
            });

            logContainer.innerHTML = htmlContent;
            updateUndoButtonState();
        }

        function applyTransactionFilters() {
            const filteredTransactions = getFilteredTransactions();
            renderTransactionRecords(filteredTransactions);

            document.getElementById('totalCount').textContent = filteredTransactions.length;
            document.getElementById('incomeCount').textContent = filteredTransactions.filter(tx => tx.type === 'Income').length;
            document.getElementById('spendingCount').textContent = filteredTransactions.filter(tx => tx.type === 'Expense').length;
            document.getElementById('netAmount').textContent = `$${filteredTransactions.reduce((sum, tx) => sum + Number((tx.newBalance - tx.initialBalance).toFixed(2)), 0).toFixed(2)}`;
        }

        function clearTransactionFilters() {
            document.getElementById('filterSearch').value = '';
            document.getElementById('filterScope').value = 'all';
            document.getElementById('filterPeriod').value = '';
            document.getElementById('filterStudent').value = '';
            document.getElementById('filterType').value = '';
            document.getElementById('filterFromDate').value = '';
            document.getElementById('filterToDate').value = '';

            applyTransactionFilters();
        }

        /**
         * Fetches transaction data from the server and populates the activity log. It handles errors gracefully and logs the last response for debugging purposes.
         */
        function loadTransactionData() {
            try {
                const logContainer = document.getElementById('recordsContainer');
                logContainer.innerHTML = ''; // Clear existing entries

                callServer('fetchTransactionsDataCached', null, (res) => {
                    const response = JSON.parse(res);

                    if (response && Array.isArray(response)) {
                        allTransactions = response;
                        populateStudentFilterOptions(allTransactions);
                        applyTransactionFilters();

                        // Fill in general transaction statistics
                    } else {
                        console.error("Invalid response format from server.");
                    }
                }, (error) => {
                    console.error("Error fetching transaction data:", error);
                });
            } catch (err) {
                console.error("Error in loadTransactionData:", err);
            }
        }

        function updateUndoButtonState() {
            const undoBtn = document.getElementById('undoSelectedBtn');
            const selectedItems = document.querySelectorAll('[data-selectable="true"].selected');
            undoBtn.disabled = selectedItems.length === 0;
        }

        function undoSelectedTransactions() {
            const selectedItems = document.querySelectorAll('[data-selectable="true"].selected');
            if (selectedItems.length === 0) return;

            const transactionIds = Array.from(selectedItems).map(item => item.querySelector('.log-item-id').textContent.replace('TXN#', ''));

            console.log("Undoing Transactions:", transactionIds);

            callServer('undoTransactions', JSON.stringify({ transactionIds }), (response) => {
                if (response) {
                    console.log("Successfully undone transactions:", transactionIds);
                    // Refresh the log after undoing
                    loadTransactionData();
                } else {
                    console.error("Failed to undo transactions:", response.error);
                }
            }, (error) => {
                console.error("Error undoing transactions:", error);
            });
        }
    </script>
</body>

</html>
