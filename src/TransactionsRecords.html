<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transactions Records</title>
  <style>
    * {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      box-sizing: border-box;
      user-select: none;
    }

    input[type="text"],
    input[type="date"],
    select {
      user-select: text;
    }

    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #fafbfc;
      overflow: hidden;
      font-size: 12px;
      color: #24292e;
    }

    .main-content {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }

    .header {
      background: #fff;
      border-bottom: 2px solid #0366d6;
      padding: 12px;
    }

    .header-title {
      font-weight: 700;
      font-size: 14px;
      color: #24292e;
      margin: 0;
    }

    .header-subtitle {
      font-size: 11px;
      color: #6a737d;
      margin: 2px 0 0 0;
    }

    .controls {
      background: #fff;
      padding: 10px;
      border-bottom: 1px solid #e1e4e8;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .control-group label {
      font-size: 9px;
      color: #586069;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .control-group input,
    .control-group select {
      padding: 5px 6px;
      border: 1px solid #e1e4e8;
      border-radius: 3px;
      font-size: 11px;
      transition: border 0.1s;
    }

    .control-group input:focus,
    .control-group select:focus {
      border-color: #0366d6;
      outline: none;
      box-shadow: inset 0 0 0 1px #0366d6;
    }

    .btn-filter {
      padding: 5px 10px;
      background: #0366d6;
      color: white;
      border: none;
      border-radius: 3px;
      font-weight: 600;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
      height: 26px;
    }

    .btn-filter:hover {
      background: #0256c7;
      transform: translateY(-1px);
    }

    .btn-filter:active {
      transform: translateY(0);
    }

    .btn-clear {
      padding: 5px 10px;
      background: #6a737d;
      color: white;
      border: none;
      border-radius: 3px;
      font-weight: 600;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
      height: 26px;
    }

    .btn-clear:hover {
      background: #586069;
    }

    .records-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .record-item {
      background: #fff;
      border: 1px solid #e1e4e8;
      border-radius: 4px;
      padding: 8px;
      margin-bottom: 6px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .record-item.income {
      border-left: 3px solid #28a745;
    }

    .record-item.spending {
      border-left: 3px solid #d73a49;
    }

    .record-item.deposit {
      border-left: 3px solid #6f42c1;
    }

    .record-item.withdraw {
      border-left: 3px solid #0366d6;
    }

    .record-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .record-student {
      font-weight: 700;
      font-size: 12px;
      color: #24292e;
    }

    .record-type {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      padding: 2px 6px;
      border-radius: 2px;
      background: #f6f8fa;
      color: #586069;
    }

    .record-type.income {
      background: #f3ffe3;
      color: #155724;
    }

    .record-type.spending {
      background: #fde8e8;
      color: #721c24;
    }

    .record-type.deposit {
      background: #f6f3ff;
      color: #24292e;
    }

    .record-type.withdraw {
      background: #f1f8ff;
      color: #24292e;
    }

    .record-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 10px;
      margin: 4px 0;
      color: #6a737d;
    }

    .record-detail-item {
      display: flex;
      justify-content: space-between;
    }

    .record-detail-label {
      font-weight: 600;
      color: #586069;
    }

    .record-detail-value {
      color: #24292e;
      font-family: monospace;
    }

    .record-amount {
      font-weight: 700;
      font-size: 12px;
      text-align: right;
      margin-top: 4px;
      font-family: monospace;
    }

    .record-amount.positive {
      color: #28a745;
    }

    .record-amount.negative {
      color: #d73a49;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #6a737d;
      font-size: 11px;
    }

    .empty-state-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .stats-bar {
      background: #f6f8fa;
      border-top: 1px solid #e1e4e8;
      border-bottom: 1px solid #e1e4e8;
      padding: 8px 10px;
      display: flex;
      justify-content: space-around;
      font-size: 10px;
      color: #586069;
    }

    .stat {
      text-align: center;
    }

    .stat-label {
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      font-size: 9px;
    }

    .stat-value {
      font-size: 12px;
      font-weight: 700;
      color: #24292e;
      margin-top: 2px;
      font-family: monospace;
    }
  </style>
</head>

<body>
  <div class="main-content">
    <!-- Header -->
    <div class="header">
      <h1 class="header-title">📊 Transaction Records</h1>
      <p class="header-subtitle">View all B-Bucks transactions and activity logs</p>
    </div>

    <!-- Controls & Filters -->
    <div class="controls">
      <div class="control-group">
        <label>Period</label>
        <select id="filterPeriod">
          <option value="">All Periods</option>
          <option value="1">Period 1</option>
          <option value="2">Period 2</option>
          <option value="3">Period 3</option>
          <option value="4">Period 4</option>
        </select>
      </div>

      <div class="control-group" style="flex: 1; min-width: 150px;">
        <label>Student</label>
        <select id="filterStudent">
          <option value="">All Students</option>
        </select>
      </div>

      <div class="control-group">
        <label>Type</label>
        <select id="filterType">
          <option value="">All Types</option>
          <option value="income">Income</option>
          <option value="spending">Spending</option>
          <option value="deposit">Deposit</option>
          <option value="withdraw">Withdraw</option>
        </select>
      </div>

      <div class="control-group">
        <label>From Date</label>
        <input type="date" id="filterFromDate">
      </div>

      <div class="control-group">
        <label>To Date</label>
        <input type="date" id="filterToDate">
      </div>

      <button class="btn-filter" id="applyFilterBtn">Filter</button>
      <button class="btn-clear" id="clearFilterBtn">Clear</button>
    </div>

    <!-- Statistics Bar -->
    <div class="stats-bar">
      <div class="stat">
        <div class="stat-label">Total</div>
        <div class="stat-value" id="totalCount">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Income</div>
        <div class="stat-value" id="incomeCount">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Spending</div>
        <div class="stat-value" id="spendingCount">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Net</div>
        <div class="stat-value" id="netAmount">$0.00</div>
      </div>
    </div>

    <!-- Records Container -->
    <div class="records-container" id="recordsContainer">
      <div class="empty-state">
        <div class="empty-state-icon">📭</div>
        <div>No transactions found. Use filters to search.</div>
      </div>
    </div>
  </div>
</body>

</html>
