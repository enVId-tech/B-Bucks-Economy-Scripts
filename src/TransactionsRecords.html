<!-- This file contains the HTML structure for the Transactions Records, which allows users to view and manage their transaction history, including filtering, searching, and exporting options. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions Records</title>

    <!-- For contributors: Ignore these warning, this is a syntax issue with VSC not recognizing the server-side templating -->
    <!-- These lines MUST be included for the application to function correctly -->
    <?!= include('styles/TransactionsRecords'); ?>
    <?!= include('styles/DisplayState'); ?>

    <!-- Include Client-to-Server HTML Utility to neatly transfer data between client and server through a JSON string -->
    <?!= include('utils/ClientToServer'); ?>

    <!-- Rolling window over the transaction log (pairs with utils/TransactionCache.ts) -->
    <?!= include('utils/TransactionWindow'); ?>
</head>

<body>
    <!-- Navigation Header -->
    <div class="nav-header">
        <button class="nav-link" onclick="callServer('openManualBalanceManager')">💰 Manual B-Bucks
            Modifier</button>
        <button class="nav-link" onclick="callServer('openIncomesExpenses')">💸 Income / Expenses</button>
        <button class="nav-link" onclick="callServer('openInvestmentsManager')">📈 Investment
            Banking</button>
        <button class="nav-link active" onclick="callServer('openTransactionsRecords')">📊 Transaction
            Records</button>
        <button class="nav-link" onclick="callServer('openHistoricalAnalytics')">📉 Historical Analytics</button>
        <button class="nav-link" onclick="callServer('openBankingSettings')">⚙️ Banking Settings</button>
    </div>

    <div class="main-content">
        <!-- Header -->
        <div class="header">
            <h1 class="header-title">📊 Transaction Records</h1>
            <p class="header-subtitle">View all B-Bucks transactions and activity logs</p>
        </div>

        <!-- Controls & Filters -->
        <div class="controls">
            <div class="control-group control-group-search">
                <label>Search</label>
                <input type="text" id="filterSearch" placeholder="Search records" oninput="applyTransactionFilters()">
            </div>

            <div class="control-group control-group-scope">
                <label>Scope</label>
                <select id="filterScope" onchange="applyTransactionFilters()">
                    <option value="all">All Fields</option>
                    <option value="student">Student</option>
                    <option value="item">Item</option>
                    <option value="type">Type</option>
                    <option value="period">Period</option>
                    <option value="id">Transaction ID</option>
                    <option value="column">Column</option>
                </select>
            </div>

            <div class="control-group">
                <label>Period</label>
                <select id="filterPeriod" onchange="applyTransactionFilters()">
                    <option value="">All Periods</option>
                </select>
            </div>

            <div class="control-group control-group-flex">
                <label>Student</label>
                <select id="filterStudent" onchange="applyTransactionFilters()">
                    <option value="">All Students</option>
                </select>
            </div>

            <div class="control-group">
                <label>Type</label>
                <select id="filterType" onchange="applyTransactionFilters()">
                    <option value="">All Types</option>
                    <option value="income">Income</option>
                    <option value="spending">Spending</option>
                    <option value="deposit">Investment</option>
                </select>
            </div>

            <div class="control-group">
                <label>From Date</label>
                <input type="date" id="filterFromDate" onchange="applyTransactionFilters()">
            </div>

            <div class="control-group">
                <label>To Date</label>
                <input type="date" id="filterToDate" onchange="applyTransactionFilters()">
            </div>

            <div class="action-bar-section">
                <label class="action-bar-label">Page</label>
                <input type="number" id="logPage" value="1" min="1" class="action-bar-input"
                    oninput="applyTransactionFilters()" onchange="applyTransactionFilters()">
            </div>
            <div class="action-bar-section">
                <label class="action-bar-label">Displayed</label>
                <input type="number" id="logLimit" value="25" min="1" class="action-bar-input"
                    oninput="applyTransactionFilters()" onchange="applyTransactionFilters()">
            </div>

            <button class="btn-clear" id="clearFilterBtn" onclick="clearTransactionFilters()">Reset Filters</button>
        </div>

        <!-- Statistics Bar -->
        <div class="stats-bar">
            <div class="stat">
                <div class="stat-label">Total</div>
                <div class="stat-value" id="totalCount">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Income</div>
                <div class="stat-value" id="incomeCount">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Spending</div>
                <div class="stat-value" id="spendingCount">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Net</div>
                <div class="stat-value" id="netAmount">$0.00</div>
            </div>
        </div>

        <!-- Action Bar -->
        <div class="log-action-bar">
            <button class="btn-undo-selected" id="undoSelectedBtn" onclick="undoSelectedTransactions()" disabled>Undo
                Selected</button>

            <button class="btn-refresh" onclick="loadTransactionData()">Refresh Transactions</button>
        </div>

        <div class="loading-indicator" id="loadingIndicator">
            <div class="loading-spinner"></div>
            <span>Loading transactions...</span>
        </div>

        <!-- Records Container -->
        <div class="records-container" id="recordsContainer"></div>
    </div>
    <script>

        function updateUndoButtonState() {
            const undoBtn = document.getElementById('undoSelectedBtn');
            const selectedItems = document.querySelectorAll('[data-selectable="true"].selected');
            undoBtn.disabled = selectedItems.length === 0;
        }

        // ---- Rolling transaction log: only a window of pages is ever held in memory (see utils/TransactionWindow.html) ----
        const txLog = new RollingTransactionLog();
        let facets = { periods: [], types: [], allStudents: [], studentsByPeriod: {} };
        let applyFiltersTimer = null;
        let renderToken = 0;

        const TYPE_LABELS = { Income: 'Income', Expense: 'Spending', Investment: 'Investment' };
        const TYPE_VALUES = { Income: 'income', Expense: 'spending', Investment: 'deposit' };

        function getTransactionTypeLabel(type) {
            return TYPE_VALUES[type] || 'unknown';
        }

        /** Filters sent to the server. Dates become epoch ms in the admin's own time zone. */
        function getServerFilters() {
            const fromDate = document.getElementById('filterFromDate').value;
            const toDate = document.getElementById('filterToDate').value;
            return {
                search: document.getElementById('filterSearch').value.trim(),
                scope: document.getElementById('filterScope').value,
                period: document.getElementById('filterPeriod').value,
                student: document.getElementById('filterStudent').value,
                type: document.getElementById('filterType').value,
                fromMs: fromDate ? new Date(`${fromDate}T00:00:00`).getTime() : null,
                toMs: toDate ? new Date(`${toDate}T23:59:59.999`).getTime() : null
            };
        }

        /** Rebuilds a <select> from a list of {value, label}, keeping the current choice if it still exists. */
        function fillSelect(selectId, firstLabel, options) {
            const select = document.getElementById(selectId);
            const current = select.value;
            select.innerHTML = '';
            const first = document.createElement('option');
            first.value = '';
            first.textContent = firstLabel;
            select.appendChild(first);
            options.forEach(({ value, label }) => {
                const option = document.createElement('option');
                option.value = value;
                option.textContent = label;
                select.appendChild(option);
            });
            select.value = options.some(o => String(o.value) === current) ? current : '';
        }

        function populateStudentOptions() {
            const period = document.getElementById('filterPeriod').value;
            const names = period ? (facets.studentsByPeriod[period] || []) : facets.allStudents;
            fillSelect('filterStudent', 'All Students', names.map(name => ({ value: name, label: name })));
        }

        function populateFilterOptions() {
            fillSelect('filterPeriod', 'All Periods', facets.periods.map(p => ({ value: p, label: `Period ${p}` })));
            fillSelect('filterType', 'All Types', facets.types.map(t => ({ value: TYPE_VALUES[t] || 'unknown', label: TYPE_LABELS[t] || t })));
            populateStudentOptions();
        }

        /** Drop-down contents come from a compact server summary, never from the full log. Respects the date range. */
        async function loadFacets() {
            try {
                const { fromMs, toMs } = getServerFilters();
                const result = await callServerAsync('fetchTransactionFacets', JSON.stringify({ fromMs, toMs }));
                if (result && !result.error) {
                    facets = result;
                    populateFilterOptions();
                }
            } catch (error) {
                console.error('Failed to load filter options:', error);
            }
        }

        function updateStats(stats) {
            if (!stats) return;
            document.getElementById('totalCount').textContent = stats.total;
            document.getElementById('incomeCount').textContent = stats.income;
            document.getElementById('spendingCount').textContent = stats.spending;
            document.getElementById('netAmount').textContent = `$${Number(stats.net).toFixed(2)}`;
        }

        /** Debounced so typing in the search / page boxes doesn't fire a request per keystroke. */
        function applyTransactionFilters() {
            clearTimeout(applyFiltersTimer);
            applyFiltersTimer = setTimeout(() => renderCurrentRecordsPage(false), 200);
        }

        /**
         * Shows the page named in the Page box. Pages inside the in-memory window render instantly; anything else is fetched,
         * and the window (plus the server cache) then re-centres around the page in the background.
         */
        async function renderCurrentRecordsPage(force = false) {
            const token = ++renderToken;
            const limitInput = document.getElementById('logLimit');
            const pageInput = document.getElementById('logPage');

            const limit = Math.max(1, Math.min(200, Number.parseInt(limitInput.value, 10) || 25));
            limitInput.value = limit;
            const page = Math.max(1, Number.parseInt(pageInput.value, 10) || 1);

            setElementDisplay(document.getElementById('loadingIndicator'), 'flex');
            try {
                const result = await txLog.getPage({ page, pageSize: limit, filters: getServerFilters(), force, includeStats: true });
                if (token !== renderToken) return; // a newer request superseded this one

                pageInput.value = result.page; // the server clamps pages past the end
                pageInput.setAttribute('max', result.totalPages);
                updateStats(result.stats);
                renderTransactionRecords(result.records);
                setElementDisplay(document.getElementById('loadingIndicator'), 'none');
            } catch (error) {
                if (token !== renderToken) return;
                console.error('Error fetching transaction data:', error);
                document.getElementById('recordsContainer').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <div>Failed to load transactions. Please try again later.</div>
                    </div>
                `;
                setElementDisplay(document.getElementById('loadingIndicator'), 'none');
            }
        }

        function clearTransactionFilters() {
            document.getElementById('filterSearch').value = '';
            document.getElementById('filterScope').value = 'all';
            document.getElementById('filterPeriod').value = '';
            document.getElementById('filterStudent').value = '';
            document.getElementById('filterType').value = '';
            document.getElementById('filterFromDate').value = '';
            document.getElementById('filterToDate').value = '';
            document.getElementById('logPage').value = '1';
            document.getElementById('logLimit').value = '25';

            loadFacets();
            applyTransactionFilters();
        }

        /**
         * Reloads the log.
         * @param {boolean} force - true (the Refresh button) rebuilds the server cache from the sheet, picking up manual sheet edits.
         *   false (first load, after an undo) only drops the browser window; the server cache validates itself by row count.
         */
        function loadTransactionData(force = true) {
            txLog.invalidate();
            document.getElementById('recordsContainer').innerHTML = '';
            // The page of records is what the admin is waiting for; the filter drop-down choices can follow right behind it.
            Promise.resolve(renderCurrentRecordsPage(force)).finally(() => loadFacets());
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('filterPeriod').addEventListener('change', () => {
                populateStudentOptions();
                applyTransactionFilters();
            });

            // The date range narrows which periods / students / types exist, so the drop-downs are rebuilt with it
            ['filterFromDate', 'filterToDate'].forEach(id => {
                document.getElementById(id).addEventListener('change', async () => {
                    await loadFacets();
                    applyTransactionFilters();
                });
            });

            document.getElementById('recordsContainer').addEventListener('click', (event) => {
                const recordItem = event.target.closest('[data-selectable="true"]');
                if (!recordItem) return;

                event.stopPropagation();
                recordItem.classList.toggle('selected');
                updateUndoButtonState();
            });

            // Deselect all when clicking outside
            document.addEventListener('click', (event) => {
                if (event.target === document.body || event.target === document.documentElement) {
                    document.querySelectorAll('[data-selectable="true"].selected').forEach(item => {
                        item.classList.remove('selected');
                    });
                    updateUndoButtonState();
                }
            });

            loadTransactionData(false);
        });


        function getTransactionTypeLabel(type) {
            const typeMapping = {
                Income: 'income',
                Expense: 'spending',
                Investment: 'deposit',
            };

            return typeMapping[type] || 'unknown';
        }

        function renderTransactionRecords(transactions) {
            const logContainer = document.getElementById('recordsContainer');

            if (!transactions.length) {
                logContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔎</div>
                        <div>No transactions match the current filters.</div>
                    </div>
                `;
                updateUndoButtonState();
                return;
            }

            let htmlContent = '';

            // The server already returned exactly this page, newest first.
            const paginatedTransactions = transactions;

            paginatedTransactions.forEach(transaction => {
                const { id, individual, period, type, serviceProvided, unitPrice, quantity, modifiedColumn, tenderedMoney, initialColumnAmount, newColumnAmount, initialBalance, newBalance, timestamp } = transaction;

                const balanceDelta = Number((newBalance - initialBalance).toFixed(2));
                const balanceDeltaClass = balanceDelta < 0 ? 'negative' : balanceDelta > 0 ? 'positive' : 'static';
                const balanceDeltaSymbol = balanceDelta < 0 ? '-' : '+';

                const columnDelta = Number((newColumnAmount - initialColumnAmount).toFixed(2));
                const columnDeltaClass = columnDelta < 0 ? 'negative' : columnDelta > 0 ? 'positive' : 'static';
                const columnDeltaSymbol = columnDelta < 0 ? '-' : '+';

                const mathBalanceOperationElement = `
                    <span class="record-formula-token ${initialBalance < 0 ? 'negative' : 'static'}">$${initialBalance}</span>
                    <span class="record-formula-symbol ${balanceDeltaClass}">${balanceDeltaSymbol}</span>
                    <span class="record-formula-token ${balanceDeltaClass}">$${Number(Math.abs(balanceDelta).toFixed(2))}</span>
                    <span class="record-formula-symbol static">=</span>
                    <span class="record-formula-token ${newBalance < 0 ? 'negative' : 'positive'}">$${newBalance}</span>
                `;

                const mathColumnOperationElement = `
                    <span class="record-formula-token ${initialColumnAmount < 0 ? 'negative' : 'static'}">$${initialColumnAmount}</span>
                    <span class="record-formula-symbol ${columnDeltaClass}">${columnDeltaSymbol}</span>
                    <span class="record-formula-token ${columnDeltaClass}">$${Number(Math.abs(columnDelta).toFixed(2))}</span>
                    <span class="record-formula-symbol static">=</span>
                    <span class="record-formula-token ${newColumnAmount < 0 ? 'negative' : 'positive'}">$${newColumnAmount}</span>
                `;

                const realTime = new Date(timestamp).toLocaleString();
                const typeMapping = {
                    Income: 'income',
                    Expense: 'spending',
                    Investment: 'deposit',
                };

                htmlContent += `
                <div class="record-item ${typeMapping[type] || 'unknown'}" data-selectable="true" data-transaction-id="${id}">
                    <div class="record-item-content">
                        <div class="record-summary">
                            <div class="record-summary-left">
                                <span class="record-student">${individual}</span>
                                <span class="record-type ${typeMapping[type] || 'unknown'}">${type}</span>
                            </div>
                            <div class="record-top-meta">
                                <span class="record-meta-chip">Period ${period}</span>
                                <span class="record-meta-chip">#${id}</span>
                            </div>
                        </div>
                        <div class="record-highlight-row">
                            <div>
                                <span class="record-highlight-label">Date</span>
                                <span class="record-highlight-value">${realTime}</span>
                            </div>
                            <div>
                                <span class="record-highlight-label">Item</span>
                                <span class="record-highlight-value record-strong">${serviceProvided}</span>
                            </div>
                        </div>
                        <div class="record-details">
                            <div class="record-detail-item"><span class="record-detail-label">Column Modified:</span> <span class="record-detail-value record-strong">${modifiedColumn}</span></div>
                            <div class="record-detail-item"><span class="record-detail-label">Unit Price:</span> <span class="record-detail-value record-strong">$${unitPrice}</span></div>
                            <div class="record-detail-item"><span class="record-detail-label">Quantity:</span> <span class="record-detail-value record-strong">${quantity}</span></div>
                            <div class="record-detail-item"><span class="record-detail-label">Tendered Money:</span> <span class="record-detail-value record-strong">$${tenderedMoney}</span></div>
                            <div class="record-detail-item"><span class="record-detail-label">Column Delta:</span> <span class="record-detail-value ${columnDeltaClass}"><span class="record-formula">${mathColumnOperationElement}</span></span></div>
                            <div class="record-detail-item"><span class="record-detail-label">Balance Delta:</span> <span class="record-detail-value ${balanceDeltaClass}"><span class="record-formula">${mathBalanceOperationElement}</span></span></div>
                        </div>
                    </div>
                </div>
                `;
            });

            logContainer.innerHTML = htmlContent;
            updateUndoButtonState();
            setElementDisplay(document.getElementById('loadingIndicator'), 'none'); // Hide loading indicator
        }

        function updateUndoButtonState() {
            const undoBtn = document.getElementById('undoSelectedBtn');
            const selectedItems = document.querySelectorAll('[data-selectable="true"].selected');
            undoBtn.disabled = selectedItems.length === 0;
        }

        function undoSelectedTransactions() {
            const selectedItems = document.querySelectorAll('[data-selectable="true"].selected');
            if (selectedItems.length === 0) return;

            const transactionIds = Array.from(selectedItems).map(item => item.dataset.transactionId);

            console.log("Undoing Transactions:", transactionIds);

            callServer('undoTransactions', JSON.stringify({ transactionIds }), (response) => {
                if (response) {
                    console.log("Successfully undone transactions:", transactionIds);
                    // Refresh the log after undoing
                    loadTransactionData(false);
                } else {
                    console.error("Failed to undo transactions:", response.error);
                }
            }, (error) => {
                console.error("Error undoing transactions:", error);
            });
        }
    </script>
</body>

</html>
