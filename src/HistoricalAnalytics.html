<!-- This file contains the HTML structure for the Historical Analytics page of the B-Bucks Economy Scripts project, providing a modernized light-theme interface for analyzing historical economic data. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historical Economic Analytics</title>

    <!-- Include Chart.js via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Style import -->
    <?!= include('styles/HistoricalAnalytics'); ?>

    <!-- Include Client-to-Server HTML Utility -->
    <?!= include('utils/ClientToServer'); ?>
</head>

<body>
    <!-- Top Navigation Header -->
    <div class="nav-header">
        <button class="nav-link" onclick="callServer('openManualBalanceManager')">💰 Manual B-Bucks Modifier</button>
        <button class="nav-link" onclick="callServer('openIncomesExpenses')">💸 Income / Expenses</button>
        <button class="nav-link" onclick="callServer('openInvestmentsManager')">📈 Investment Banking</button>
        <button class="nav-link" onclick="callServer('openTransactionsRecords')">📊 Transaction Records</button>
        <button class="nav-link active" onclick="callServer('openHistoricalAnalytics')">📉 Historical Analytics</button>
        <button class="nav-link" onclick="callServer('openBankingSettings')">⚙️ Banking Settings</button>
    </div>

    <div class="main-content">
        <!-- Title Banner Card -->
        <div class="header-bar">
            <h1 class="header-title">📉 Historical Economic Analytics</h1>
            <p class="header-subtitle">Visualize multi-metric trends dynamically across dynamic sheet records and
                columns</p>
            <p class="header-subtitle"><strong>Hint:</strong> Hold Ctrl to selection multiple options to visualize more
                data!</p>
        </div>

        <!-- Controls Form Panel (Single Row Auto-Sized Fit Layout) -->
        <div class="controls-panel">
            <div class="control-group">
                <label>Metric Columns (Multi-Select)</label>
                <select id="metricSelect" multiple size="4" onchange="renderChart()">
                    <!-- Populated dynamically -->
                </select>
            </div>

            <div class="control-group">
                <label>Sheet / Period Scope (Multi-Select)</label>
                <select id="periodSelect" multiple size="4" onchange="renderChart()">
                    <!-- Populated dynamically -->
                </select>
            </div>

            <div class="control-group">
                <label>Scale Type</label>
                <select id="scaleSelect" onchange="renderChart()">
                    <option value="linear">Linear Scale</option>
                    <option value="logarithmic">Logarithmic Scale</option>
                </select>
            </div>

            <div class="control-group">
                <label>From Date</label>
                <input type="date" id="filterFromDate" onchange="renderChart()">
            </div>

            <div class="control-group">
                <label>To Date</label>
                <input type="date" id="filterToDate" onchange="renderChart()">
            </div>

            <div class="control-group">
                <label>Current Values</label>
                <label class="live-toggle" title="Adds a point computed right now from the period sheets, even if today's snapshot hasn't been recorded yet">
                    <input type="checkbox" id="includeLive" checked onchange="renderChart()"> Include live (now)
                </label>
            </div>

            <button class="btn-reset" onclick="resetAnalyticsFilters()">
                Reset Filters
            </button>
        </div>

        <!-- Data status (live point computed / problems) -->
        <div id="dataNotice" class="data-notice is-hidden"></div>

        <!-- Main Chart Display Card -->
        <div class="chart-card">
            <div class="loading-overlay" id="loadingIndicator">
                <div class="loading-spinner"></div>
                <span>Fetching historical economic records...</span>
            </div>
            <div class="chart-wrapper">
                <canvas id="analyticsChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        let rawRecordData = [];
        let availableHeaders = [];
        let chartInstance = null;
        let payloadMeta = null;

        const chartColors = [
            '#0366d6', // Classic Blue
            '#16a34a', // Emerald Green
            '#dc2626', // Bright Red
            '#ea580c', // Orange
            '#9333ea', // Purple
            '#0891b2', // Cyan / Teal
            '#d97706', // Amber
            '#db2777', // Pink
            '#475569'  // Slate
        ];

        document.addEventListener('DOMContentLoaded', () => {
            loadHistoricalData();
        });

        function loadHistoricalData() {
            document.getElementById('loadingIndicator').style.display = 'flex';

            callServer('fetchHistoricalRecordbookData', null, (response) => {
                try {
                    const parsed = typeof response === 'string' ? JSON.parse(response) : response;

                    if (parsed && Array.isArray(parsed.records)) {
                        rawRecordData = parsed.records;
                        availableHeaders = parsed.headers || [];
                        payloadMeta = parsed.meta || null;
                        showDataNotice();

                        populateDynamicDropdowns();
                        renderChart();
                    } else {
                        console.error("Invalid historical record payload:", response);
                    }
                } catch (e) {
                    console.error("Failed to parse historical payload:", e);
                } finally {
                    document.getElementById('loadingIndicator').style.display = 'none';
                }
            }, (err) => {
                console.error("Failed to fetch historical record data:", err);
                document.getElementById('loadingIndicator').style.display = 'none';
            });
        }

        function populateDynamicDropdowns() {
            const metricSelect = document.getElementById('metricSelect');
            metricSelect.innerHTML = '';

            availableHeaders.forEach((hdr, idx) => {
                const opt = document.createElement('option');
                opt.value = hdr.key;
                opt.textContent = hdr.label;
                if (idx === 0) opt.selected = true;
                metricSelect.appendChild(opt);
            });

            const periodSelect = document.getElementById('periodSelect');
            periodSelect.innerHTML = '';

            // All Periods (Combined) -> Sums all matching values across sheets
            const sumOpt = document.createElement('option');
            sumOpt.value = 'all-sum';
            sumOpt.textContent = 'All Periods (Combined)';
            sumOpt.selected = true;
            periodSelect.appendChild(sumOpt);

            // All Periods (Average) -> Calculates mean of matching values across sheets
            const avgOpt = document.createElement('option');
            avgOpt.value = 'all-avg';
            avgOpt.textContent = 'All Periods (Average)';
            periodSelect.appendChild(avgOpt);

            const periodSet = new Set();
            rawRecordData.forEach(r => { if (r.sheet) periodSet.add(r.sheet); });

            Array.from(periodSet).sort().forEach(p => {
                const opt = document.createElement('option');
                opt.value = p;
                opt.textContent = p;
                periodSelect.appendChild(opt);
            });
        }

        function getSelectedValues(selectElement) {
            return Array.from(selectElement.selectedOptions).map(option => option.value);
        }

        /**
         * Tells the admin when the live point couldn't be computed, instead of silently plotting stale data.
         */
        function showDataNotice() {
            const el = document.getElementById('dataNotice');
            if (!payloadMeta) { el.style.display = 'none'; return; }

            if (payloadMeta.liveError) {
                el.textContent = `⚠️ ${payloadMeta.liveError} The chart shows recorded history only.`;
                el.className = 'data-notice warn';
                el.style.display = 'block';
            } else if (payloadMeta.liveIncluded) {
                el.textContent = `Live values computed at ${new Date(payloadMeta.generatedAt).toLocaleTimeString()}. The highlighted ◆ point is not stored until the next daily record.`;
                el.className = 'data-notice';
                el.style.display = 'block';
            } else {
                el.style.display = 'none';
            }
        }

        /**
         * The records the chart should plot right now.
         *  - applies the date range (compared as yyyy-mm-dd strings, so there is no time-zone drift),
         *  - optionally drops the live "now" point,
         *  - keeps only the NEWEST snapshot per day per period, so two snapshots on one day are never added together.
         */
        function getVisibleRecords() {
            const includeLive = document.getElementById('includeLive').checked;
            const fromDay = document.getElementById('filterFromDate').value;
            const toDay = document.getElementById('filterToDate').value;

            const newest = new Map();
            rawRecordData.forEach(record => {
                if (record.live && !includeLive) return;
                if (fromDay && record.day < fromDay) return;
                if (toDay && record.day > toDay) return;

                const key = `${record.day}|${record.sheet}`;
                const existing = newest.get(key);
                if (!existing || record.ts >= existing.ts) newest.set(key, record);
            });
            return Array.from(newest.values());
        }

        function renderChart() {
            const visibleRecords = getVisibleRecords();
            const metricSelectEl = document.getElementById('metricSelect');

            let selectedMetrics = getSelectedValues(metricSelectEl);
            if (!selectedMetrics.length && availableHeaders.length > 0) {
                selectedMetrics = [availableHeaders[0].key];
            }

            let selectedPeriods = getSelectedValues(document.getElementById('periodSelect'));
            if (!selectedPeriods.length) selectedPeriods = ['all-sum'];

            const scaleType = document.getElementById('scaleSelect').value || 'linear';

            // One chart point per calendar day, oldest to newest regardless of which sheet each snapshot came from.
            const dayInfo = new Map();
            visibleRecords.forEach(record => {
                const info = dayInfo.get(record.day) || { label: record.dateStr || record.day, live: false };
                if (record.live) info.live = true;
                dayInfo.set(record.day, info);
            });
            const days = Array.from(dayInfo.keys()).sort();
            const labels = days.map(day => dayInfo.get(day).live ? `${dayInfo.get(day).label} (live)` : dayInfo.get(day).label);
            const liveFlags = days.map(day => dayInfo.get(day).live);

            const datasets = [];
            let colorIndex = 0;

            selectedPeriods.forEach(period => {
                const isAggregate = (period === 'all-sum' || period === 'all-avg' || period === 'all');
                const periodRecords = visibleRecords.filter(rec => isAggregate || rec.sheet === period);

                selectedMetrics.forEach(metricKey => {
                    const optionEl = metricSelectEl.querySelector(`option[value="${metricKey}"]`);
                    const metricLabel = optionEl ? optionEl.text : metricKey;

                    let datasetLabel = metricLabel;
                    if (period === 'all-sum') {
                        datasetLabel = `All Combined - ${metricLabel}`;
                    } else if (period === 'all-avg') {
                        datasetLabel = `All Average - ${metricLabel}`;
                    } else if (selectedPeriods.length > 1) {
                        datasetLabel = `${period} - ${metricLabel}`;
                    } else {
                        datasetLabel = `${period} (${metricLabel})`;
                    }

                    const dataPoints = days.map(day => {
                        const matchingItems = periodRecords.filter(r => r.day === day);
                        if (!matchingItems.length) return null;

                        const validVals = matchingItems
                            .map(m => m.metrics ? m.metrics[metricKey] : null)
                            .filter(v => v !== null && v !== undefined && !isNaN(v));

                        if (validVals.length === 0) return null;

                        const sum = validVals.reduce((acc, curr) => acc + curr, 0);

                        // Branch math based on selected scope
                        if (period === 'all-avg') {
                            return +(sum / validVals.length).toFixed(2);
                        }

                        return +sum.toFixed(2);
                    });

                    const color = chartColors[colorIndex % chartColors.length];
                    colorIndex++;

                    datasets.push({
                        label: datasetLabel,
                        data: dataPoints,
                        borderColor: color,
                        backgroundColor: `${color}10`,
                        borderWidth: 2,
                        fill: false,
                        tension: 0,
                        // the live "now" point is drawn larger and as a diamond so it can't be mistaken for a stored snapshot
                        pointRadius: liveFlags.map(isLive => isLive ? 7 : 3),
                        pointStyle: liveFlags.map(isLive => isLive ? 'rectRot' : 'circle'),
                        pointHoverRadius: 8,
                        pointBackgroundColor: color,
                        spanGaps: true
                    });
                });
            });

            const ctx = document.getElementById('analyticsChart').getContext('2d');

            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            grid: { color: '#e2e8f0', drawBorder: true },
                            ticks: {
                                color: '#475569',
                                font: { size: 10 },
                                maxRotation: 45,
                                minRotation: 45
                            },
                            title: { display: true, text: 'Date', color: '#0f172a', font: { size: 11, weight: '700' } }
                        },
                        y: {
                            type: scaleType,
                            grid: { color: '#e2e8f0', drawBorder: true },
                            ticks: { color: '#475569', font: { size: 10 } },
                            title: { display: true, text: 'Value ($)', color: '#0f172a', font: { size: 11, weight: '700' } },
                            beginAtZero: scaleType === 'linear'
                        }
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: {
                                color: '#0f172a',
                                font: { size: 11, weight: '600' },
                                boxWidth: 12,
                                padding: 12
                            }
                        },
                        tooltip: {
                            backgroundColor: '#0f172a',
                            titleColor: '#ffffff',
                            bodyColor: '#e2e8f0',
                            padding: 10,
                            callbacks: {
                                label: (context) => {
                                    const val = context.raw;
                                    return ` ${context.dataset.label}: ${val !== null ? '$' + val.toLocaleString() : 'N/A'}`;
                                }
                            }
                        }
                    }
                }
            });
        }

        function resetAnalyticsFilters() {
            const metricSelect = document.getElementById('metricSelect');
            const periodSelect = document.getElementById('periodSelect');

            Array.from(metricSelect.options).forEach((opt, idx) => opt.selected = (idx === 0));
            Array.from(periodSelect.options).forEach((opt, idx) => opt.selected = (idx === 0));

            document.getElementById('scaleSelect').selectedIndex = 0;
            document.getElementById('filterFromDate').value = '';
            document.getElementById('filterToDate').value = '';
            document.getElementById('includeLive').checked = true;

            renderChart();
        }
    </script>
</body>

</html>
