<!-- This file contains the HTML structure for the Historical Analytics page of the B-Bucks Economy Scripts project, providing a modernized light-theme interface for analyzing historical economic data. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historical Economic Analytics</title>

    <!-- Include Chart.js via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Style import -->
    <?!= include('styles/HistoricalAnalytics'); ?>

    <!-- Include Client-to-Server HTML Utility -->
    <?!= include('utils/ClientToServer'); ?>
</head>

<body>
    <!-- Top Navigation Header -->
    <div class="nav-header">
        <button class="nav-link" onclick="callServer('openManualBalanceManager')">💰 Manual B-Bucks Modifier</button>
        <button class="nav-link" onclick="callServer('openIncomesExpenses')">💸 Income / Expenses</button>
        <button class="nav-link" onclick="callServer('openInvestmentsManager')">📈 Investment Banking</button>
        <button class="nav-link" onclick="callServer('openTransactionsRecords')">📊 Transaction Records</button>
        <button class="nav-link active" onclick="callServer('openHistoricalAnalytics')">📉 Historical Analytics</button>
        <button class="nav-link" onclick="callServer('openBankingSettings')">⚙️ Banking Settings</button>
    </div>

    <div class="main-content">
        <!-- Title Banner Card -->
        <div class="header-bar">
            <h1 class="header-title">📉 Historical Economic Analytics</h1>
            <p class="header-subtitle">Visualize multi-metric trends dynamically across dynamic sheet records and
                columns</p>
            <p class="header-subtitle"><strong>Hint:</strong> Hold Ctrl to selection multiple options to visualize more data!</p>
        </div>

        <!-- Controls Form Panel (Single Row Auto-Sized Fit Layout) -->
        <div class="controls-panel">
            <div class="control-group">
                <label>Metric Columns (Multi-Select)</label>
                <select id="metricSelect" multiple size="4" onchange="renderChart()">
                    <!-- Populated dynamically -->
                </select>
            </div>

            <div class="control-group">
                <label>Sheet / Period Scope (Multi-Select)</label>
                <select id="periodSelect" multiple size="4" onchange="renderChart()">
                    <!-- Populated dynamically -->
                </select>
            </div>

            <div class="control-group">
                <label>Scale Type</label>
                <select id="scaleSelect" onchange="renderChart()">
                    <option value="linear">Linear Scale</option>
                    <option value="logarithmic">Logarithmic Scale</option>
                </select>
            </div>

            <div class="control-group">
                <label>From Date</label>
                <input type="date" id="filterFromDate" onchange="renderChart()">
            </div>

            <div class="control-group">
                <label>To Date</label>
                <input type="date" id="filterToDate" onchange="renderChart()">
            </div>

            <button class="btn-reset" onclick="resetAnalyticsFilters()">
                Reset Filters
            </button>
        </div>

        <!-- Main Chart Display Card -->
        <div class="chart-card">
            <div class="loading-overlay" id="loadingIndicator">
                <div class="loading-spinner"></div>
                <span>Fetching historical economic records...</span>
            </div>
            <div class="chart-wrapper">
                <canvas id="analyticsChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        let rawRecordData = [];
        let availableHeaders = [];
        let chartInstance = null;

        const chartColors = [
            '#0366d6', // Classic Blue
            '#16a34a', // Emerald Green
            '#dc2626', // Bright Red
            '#ea580c', // Orange
            '#9333ea', // Purple
            '#0891b2', // Cyan / Teal
            '#d97706', // Amber
            '#db2777', // Pink
            '#475569'  // Slate
        ];

        document.addEventListener('DOMContentLoaded', () => {
            loadHistoricalData();
        });

        function loadHistoricalData() {
            document.getElementById('loadingIndicator').style.display = 'flex';

            callServer('fetchHistoricalRecordbookData', null, (response) => {
                try {
                    const parsed = typeof response === 'string' ? JSON.parse(response) : response;

                    if (parsed && Array.isArray(parsed.records)) {
                        rawRecordData = parsed.records;
                        availableHeaders = parsed.headers || [];

                        populateDynamicDropdowns();
                        renderChart();
                    } else {
                        console.error("Invalid historical record payload:", response);
                    }
                } catch (e) {
                    console.error("Failed to parse historical payload:", e);
                } finally {
                    document.getElementById('loadingIndicator').style.display = 'none';
                }
            }, (err) => {
                console.error("Failed to fetch historical record data:", err);
                document.getElementById('loadingIndicator').style.display = 'none';
            });
        }

        function populateDynamicDropdowns() {
            const metricSelect = document.getElementById('metricSelect');
            metricSelect.innerHTML = '';

            availableHeaders.forEach((hdr, idx) => {
                const opt = document.createElement('option');
                opt.value = hdr.key;
                opt.textContent = hdr.label;
                if (idx === 0) opt.selected = true;
                metricSelect.appendChild(opt);
            });

            const periodSelect = document.getElementById('periodSelect');
            periodSelect.innerHTML = '';

            const allOpt = document.createElement('option');
            allOpt.value = 'all';
            allOpt.textContent = 'All Periods Combined';
            allOpt.selected = true;
            periodSelect.appendChild(allOpt);

            const periodSet = new Set();
            rawRecordData.forEach(r => { if (r.sheet) periodSet.add(r.sheet); });

            Array.from(periodSet).sort().forEach(p => {
                const opt = document.createElement('option');
                opt.value = p;
                opt.textContent = p;
                periodSelect.appendChild(opt);
            });
        }

        function getSelectedValues(selectElement) {
            return Array.from(selectElement.selectedOptions).map(option => option.value);
        }

        function getFilteredRecordsByDate() {
            const fromDateVal = document.getElementById('filterFromDate').value;
            const toDateVal = document.getElementById('filterToDate').value;

            return rawRecordData.filter(record => {
                if (record.date) {
                    const recDate = new Date(record.date);
                    if (fromDateVal && recDate < new Date(`${fromDateVal}T00:00:00`)) return false;
                    if (toDateVal && recDate > new Date(`${toDateVal}T23:59:59.999`)) return false;
                }
                return true;
            });
        }

        function renderChart() {
            const dateFilteredRecords = getFilteredRecordsByDate();
            const metricSelectEl = document.getElementById('metricSelect');

            let selectedMetrics = getSelectedValues(metricSelectEl);
            if (!selectedMetrics.length && availableHeaders.length > 0) {
                selectedMetrics = [availableHeaders[0].key];
            }

            let selectedPeriods = getSelectedValues(document.getElementById('periodSelect'));
            if (!selectedPeriods.length) selectedPeriods = ['all'];

            const scaleType = document.getElementById('scaleSelect').value || 'linear';

            const dateSet = new Set();
            dateFilteredRecords.slice().reverse().forEach(item => {
                dateSet.add(item.dateStr || item.date);
            });
            const labels = Array.from(dateSet);

            const datasets = [];
            let colorIndex = 0;

            selectedPeriods.forEach(period => {
                const periodRecords = dateFilteredRecords.filter(rec => period === 'all' || rec.sheet === period);

                selectedMetrics.forEach(metricKey => {
                    const optionEl = metricSelectEl.querySelector(`option[value="${metricKey}"]`);
                    const metricLabel = optionEl ? optionEl.text : metricKey;

                    let datasetLabel = metricLabel;
                    if (selectedPeriods.length > 1 && period !== 'all') {
                        datasetLabel = `${period} - ${metricLabel}`;
                    } else if (period !== 'all' && selectedMetrics.length === 1) {
                        datasetLabel = `${period} (${metricLabel})`;
                    }

                    const dataPoints = labels.map(labelDate => {
                        const matchingItems = periodRecords.filter(r => (r.dateStr || r.date) === labelDate);
                        if (!matchingItems.length) return null;

                        const validVals = matchingItems
                            .map(m => m.metrics ? m.metrics[metricKey] : null)
                            .filter(v => v !== null && v !== undefined && !isNaN(v));

                        if (validVals.length === 0) return null;

                        const sum = validVals.reduce((acc, curr) => acc + curr, 0);
                        return +(sum / validVals.length).toFixed(2);
                    });

                    const color = chartColors[colorIndex % chartColors.length];
                    colorIndex++;

                    datasets.push({
                        label: datasetLabel,
                        data: dataPoints,
                        borderColor: color,
                        backgroundColor: `${color}10`,
                        borderWidth: 2,
                        fill: false,
                        tension: 0,
                        pointRadius: 3,
                        pointHoverRadius: 6,
                        pointBackgroundColor: color,
                        spanGaps: true
                    });
                });
            });

            const ctx = document.getElementById('analyticsChart').getContext('2d');

            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            grid: { color: '#e2e8f0', drawBorder: true },
                            ticks: {
                                color: '#475569',
                                font: { size: 10 },
                                maxRotation: 45,
                                minRotation: 45
                            },
                            title: { display: true, text: 'Date', color: '#0f172a', font: { size: 11, weight: '700' } }
                        },
                        y: {
                            type: scaleType,
                            grid: { color: '#e2e8f0', drawBorder: true },
                            ticks: { color: '#475569', font: { size: 10 } },
                            title: { display: true, text: 'Value ($)', color: '#0f172a', font: { size: 11, weight: '700' } },
                            beginAtZero: scaleType === 'linear'
                        }
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: {
                                color: '#0f172a',
                                font: { size: 11, weight: '600' },
                                boxWidth: 12,
                                padding: 12
                            }
                        },
                        tooltip: {
                            backgroundColor: '#0f172a',
                            titleColor: '#ffffff',
                            bodyColor: '#e2e8f0',
                            padding: 10,
                            callbacks: {
                                label: (context) => {
                                    const val = context.raw;
                                    return ` ${context.dataset.label}: ${val !== null ? '$' + val.toLocaleString() : 'N/A'}`;
                                }
                            }
                        }
                    }
                }
            });
        }

        function resetAnalyticsFilters() {
            const metricSelect = document.getElementById('metricSelect');
            const periodSelect = document.getElementById('periodSelect');

            Array.from(metricSelect.options).forEach((opt, idx) => opt.selected = (idx === 0));
            Array.from(periodSelect.options).forEach((opt, idx) => opt.selected = (idx === 0));

            document.getElementById('scaleSelect').selectedIndex = 0;
            document.getElementById('filterFromDate').value = '';
            document.getElementById('filterToDate').value = '';

            renderChart();
        }
    </script>
</body>

</html>
