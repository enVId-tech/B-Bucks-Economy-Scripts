<!-- This file contains the HTML structure for Historical Economic Analytics, featuring interactive multi-metric and multi-period charting, range filtering, and custom axis scaling. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historical Economic Analytics</title>

    <!-- Include Chart.js via CDN for responsive client-side rendering -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Style import -->
    <?!= include('styles/HistoricalAnalytics'); ?>

    <!-- Include Client-to-Server HTML Utility -->
    <?!= include('utils/ClientToServer'); ?>
</head>

<body>
    <!-- Navigation Header -->
    <div class="nav-header">
        <button class="nav-link" onclick="callServer('openManualBalanceManager')">💰 Manual B-Bucks Modifier</button>
        <button class="nav-link" onclick="callServer('openIncomesExpenses')">💸 Income / Expenses</button>
        <button class="nav-link" onclick="callServer('openInvestmentsManager')">📈 Investment Banking</button>
        <button class="nav-link" onclick="callServer('openTransactionsRecords')">📊 Transaction Records</button>
        <button class="nav-link active" onclick="callServer('openHistoricalAnalytics')">📉 Historical Analytics</button>
        <button class="nav-link" onclick="callServer('openBankingSettings')">⚙️ Banking Settings</button>
    </div>

    <div class="main-content">
        <!-- Header -->
        <div class="header">
            <h1 class="header-title">📉 Historical Economic Analytics</h1>
            <p class="header-subtitle">Visualize multi-metric trends across periods, custom date spans, and monetary metrics</p>
        </div>

        <!-- Controls & Filters Panel -->
        <div class="controls">
            <div class="control-group">
                <label>Metric Columns (Multi-Select)</label>
                <select id="metricSelect" multiple size="4" onchange="renderChart()">
                    <option value="totalBalances" selected>Total Balances (Col C)</option>
                    <option value="totalGross">Total Gross (Col D)</option>
                    <option value="totalNet">Total Net (Col E)</option>
                    <option value="totalDebt">Total Debt (Col F)</option>
                    <option value="totalReturns">Total Returns (Col G)</option>
                    <option value="totalInvested">Total Invested (Col H)</option>
                    <option value="m1Mean">M1 Mean (Avg Balances) (Col J)</option>
                    <option value="m2Mean">M2 Mean (Col K)</option>
                    <option value="avgGross">Avg Gross (Col L)</option>
                    <option value="avgNet">Avg Net (Col M)</option>
                    <option value="avgDebt">Avg Debt (Col N)</option>
                    <option value="avgReturns">Avg Returns (Col O)</option>
                    <option value="avgInvested">Avg Invested (Col P)</option>
                </select>
            </div>

            <div class="control-group">
                <label>Sheet / Period Scope (Multi-Select)</label>
                <select id="periodSelect" multiple size="4" onchange="renderChart()">
                    <option value="all" selected>All Periods Combined</option>
                    <option value="Period 2">Period 2</option>
                    <option value="Period 3">Period 3</option>
                    <option value="Period 4">Period 4</option>
                    <option value="Period 5">Period 5</option>
                    <option value="Period 7">Period 7</option>
                    <option value="Period 8">Period 8</option>
                </select>
            </div>

            <div class="control-group control-group-narrow">
                <label>Scale Type</label>
                <select id="scaleSelect" onchange="renderChart()">
                    <option value="linear">Linear Scale</option>
                    <option value="logarithmic">Logarithmic Scale</option>
                </select>
            </div>

            <div class="control-group control-group-narrow">
                <label>From Date</label>
                <input type="date" id="filterFromDate" onchange="renderChart()">
            </div>

            <div class="control-group control-group-narrow">
                <label>To Date</label>
                <input type="date" id="filterToDate" onchange="renderChart()">
            </div>

            <button class="btn-clear" onclick="resetAnalyticsFilters()">Reset Filters</button>
        </div>

        <div class="loading-indicator" id="loadingIndicator" style="display: flex;">
            <div class="loading-spinner"></div>
            <span>Fetching historical economic records...</span>
        </div>

        <!-- Chart Container -->
        <div class="card">
            <div class="chart-wrapper">
                <canvas id="analyticsChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        let rawRecordData = [];
        let chartInstance = null;

        // Distinct color definitions for multi-dataset rendering
        const chartColors = [
            '#0366d6', // Blue
            '#28a745', // Green
            '#d73a49', // Red
            '#f68a1e', // Orange
            '#6f42c1', // Purple
            '#17a2b8', // Teal
            '#d97706', // Amber
            '#e83e8c', // Pink
            '#4b5563'  // Dark Gray
        ];

        document.addEventListener('DOMContentLoaded', () => {
            loadHistoricalData();
        });

        /** Fetches raw historical records from the Google Apps Script backend engine */
        function loadHistoricalData() {
            document.getElementById('loadingIndicator').style.display = 'flex';

            callServer('fetchHistoricalRecordbookData', null, (response) => {
                try {
                    const parsed = typeof response === 'string' ? JSON.parse(response) : response;
                    if (Array.isArray(parsed)) {
                        rawRecordData = parsed;
                        renderChart();
                    } else {
                        console.error("Invalid historical record data format:", response);
                    }
                } catch (e) {
                    console.error("Failed to parse historical data payload:", e);
                } finally {
                    document.getElementById('loadingIndicator').style.display = 'none';
                }
            }, (err) => {
                console.error("Failed to fetch historical record data from server:", err);
                document.getElementById('loadingIndicator').style.display = 'none';
            });
        }

        /** Retrieves an array of all selected values from a multi-select element */
        function getSelectedValues(selectElement) {
            return Array.from(selectElement.selectedOptions).map(option => option.value);
        }

        /** Filters raw records according to active date bounds */
        function getFilteredRecordsByDate() {
            const fromDateVal = document.getElementById('filterFromDate').value;
            const toDateVal = document.getElementById('filterToDate').value;

            return rawRecordData.filter(record => {
                if (record.date) {
                    const recDate = new Date(record.date);
                    if (fromDateVal && recDate < new Date(`${fromDateVal}T00:00:00`)) return false;
                    if (toDateVal && recDate > new Date(`${toDateVal}T23:59:59.999`)) return false;
                }
                return true;
            });
        }

        /** Constructs and updates the Chart.js visual canvas element with dynamic multi-line scaling */
        function renderChart() {
            const dateFilteredRecords = getFilteredRecordsByDate();
            
            // Get selected metrics (default to 'totalBalances' if none chosen)
            let selectedMetrics = getSelectedValues(document.getElementById('metricSelect'));
            if (!selectedMetrics.length) selectedMetrics = ['totalBalances'];

            // Get selected periods (default to 'all' if none chosen)
            let selectedPeriods = getSelectedValues(document.getElementById('periodSelect'));
            if (!selectedPeriods.length) selectedPeriods = ['all'];

            const scaleType = document.getElementById('scaleSelect').value || 'linear';
            const metricSelectEl = document.getElementById('metricSelect');

            // Extract unique sorted dates (oldest to newest)
            const dateSet = new Set();
            dateFilteredRecords.slice().reverse().forEach(item => {
                dateSet.add(item.dateStr || item.date);
            });
            const labels = Array.from(dateSet);

            const datasets = [];
            let colorIndex = 0;

            // Generate datasets based on selections
            selectedPeriods.forEach(period => {
                // Determine whether to filter by specific sheet or include all
                const periodRecords = dateFilteredRecords.filter(rec => period === 'all' || rec.sheet === period);

                selectedMetrics.forEach(metricKey => {
                    const optionEl = metricSelectEl.querySelector(`option[value="${metricKey}"]`);
                    const metricLabel = optionEl ? optionEl.text : metricKey;
                    
                    // Build label depending on whether multiple periods or metrics are active
                    let datasetLabel = metricLabel;
                    if (selectedPeriods.length > 1 && period !== 'all') {
                        datasetLabel = `${period} - ${metricLabel}`;
                    } else if (period !== 'all' && selectedMetrics.length === 1) {
                        datasetLabel = `${period} (${metricLabel})`;
                    }

                    // Map values across chronological date labels
                    const dataPoints = labels.map(labelDate => {
                        const matchingItems = periodRecords.filter(r => (r.dateStr || r.date) === labelDate);
                        if (!matchingItems.length) return null;

                        const sum = matchingItems.reduce((acc, curr) => acc + (Number(curr[metricKey]) || 0), 0);
                        return +(sum / matchingItems.length).toFixed(2);
                    });

                    const color = chartColors[colorIndex % chartColors.length];
                    colorIndex++;

                    datasets.push({
                        label: datasetLabel,
                        data: dataPoints,
                        borderColor: color,
                        backgroundColor: `${color}15`, // Light transparent fill
                        borderWidth: 2,
                        fill: false,
                        tension: 0.2,
                        pointRadius: 2,
                        pointHoverRadius: 5,
                        pointBackgroundColor: color,
                        spanGaps: true
                    });
                });
            });

            const ctx = document.getElementById('analyticsChart').getContext('2d');

            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            grid: { color: '#e1e4e8', drawBorder: false },
                            ticks: { color: '#6a737d', font: { size: 10 } },
                            title: { display: true, text: 'Date', color: '#24292e', font: { size: 11, weight: '600' } }
                        },
                        y: {
                            type: scaleType,
                            grid: { color: '#e1e4e8', drawBorder: false },
                            ticks: { color: '#6a737d', font: { size: 10 } },
                            title: { display: true, text: 'Value ($)', color: '#24292e', font: { size: 11, weight: '600' } },
                            beginAtZero: scaleType === 'linear'
                        }
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: { color: '#24292e', font: { size: 11, weight: '600' }, boxWidth: 12 }
                        },
                        tooltip: {
                            backgroundColor: '#24292e',
                            titleFont: { size: 11 },
                            bodyFont: { size: 11 },
                            padding: 8,
                            callbacks: {
                                label: (context) => `${context.dataset.label}: $${(context.raw || 0).toLocaleString()}`
                            }
                        }
                    }
                }
            });
        }

        function resetAnalyticsFilters() {
            const metricSelect = document.getElementById('metricSelect');
            const periodSelect = document.getElementById('periodSelect');

            // Reset metric selection to first item
            Array.from(metricSelect.options).forEach((opt, idx) => opt.selected = (idx === 0));
            
            // Reset period selection to 'all'
            Array.from(periodSelect.options).forEach((opt, idx) => opt.selected = (idx === 0));

            document.getElementById('scaleSelect').selectedIndex = 0;
            document.getElementById('filterFromDate').value = '';
            document.getElementById('filterToDate').value = '';
            
            renderChart();
        }
    </script>
</body>

</html>
