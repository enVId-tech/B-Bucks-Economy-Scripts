<!-- Modernized HTML Styles for Documentation and Attribution -->

<style>
    :root {
        --bg-main: #f8fafc;
        --bg-sidebar: #ffffff;
        --bg-card: #ffffff;
        --border-color: #e2e8f0;
        --border-hover: #cbd5e1;
        --text-primary: #0f172a;
        --text-secondary: #64748b;
        --text-muted: #94a3b8;
        --accent-blue: #0366d6;
        --accent-blue-hover: #0256b8;
        --tree-hover: #f1f5f9;
        --tree-active: #eff6ff;
        --tree-guide: #cbd5e1;
        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        --radius-md: 8px;
        --radius-sm: 5px;
    }

    * {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        box-sizing: border-box;
        user-select: none;
    }

    body {
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100vw;
        background: var(--bg-main);
        overflow: hidden;
        font-size: 12px;
        color: var(--text-primary);
    }

    /* Fixed Top Header */
    .docs-header {
        height: 42px;
        padding: 0 16px;
        background: var(--bg-card);
        border-bottom: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
        z-index: 10;
    }

    .docs-header h1 {
        font-size: 12px;
        color: var(--accent-blue);
        font-weight: 800;
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    /* Split Screen Container */
    .docs-container {
        flex: 1;
        display: flex;
        overflow: hidden;
    }

    /* VSC-Style Explorer Sidebar */
    .sidebar-explorer {
        width: 280px;
        background: var(--bg-sidebar);
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        flex-shrink: 0;
    }

    .explorer-title {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-muted);
        padding: 10px 12px 6px 12px;
    }

    /* Explicit Tree Hierarchy Graphics */
    .tree-group {
        list-style: none;
        padding-left: 0;
        margin: 0;
    }

    .tree-children {
        list-style: none;
        padding-left: 14px;
        margin: 0;
        display: none;
        position: relative;
    }

    /* Vertical indentation line (IDE Style) */
    .tree-children::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 4px;
        left: 18px;
        width: 1px;
        background-color: var(--tree-guide);
    }

    .tree-children.open {
        display: block;
    }

    .tree-item {
        margin: 0;
        position: relative;
    }

    .tree-label {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 5px 10px 5px 12px;
        cursor: pointer;
        color: var(--text-secondary);
        font-size: 11px;
        font-weight: 500;
        transition: background 0.12s ease, color 0.12s ease;
        border-left: 2px solid transparent;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .tree-label:hover {
        background: var(--tree-hover);
        color: var(--text-primary);
    }

    .tree-label.active {
        background: var(--tree-active);
        color: var(--accent-blue);
        font-weight: 600;
        border-left-color: var(--accent-blue);
    }

    /* Tree Node Icons & Toggles */
    .tree-toggle {
        font-size: 8px;
        width: 10px;
        display: inline-block;
        transition: transform 0.15s ease;
        color: var(--text-muted);
    }

    .tree-toggle.expanded {
        transform: rotate(90deg);
    }

    /* Section Header Sub-Items (Inside Files) */
    .tree-header-item .tree-label {
        font-size: 10px;
        color: var(--text-muted);
        padding-left: 20px;
    }

    .tree-header-item .tree-label:hover {
        color: var(--accent-blue);
    }

    .tree-header-item .tree-label::before {
        content: "#";
        font-weight: 700;
        color: var(--text-muted);
    }

    /* Right Reading Viewport */
    .docs-panel {
        flex: 1;
        padding: 16px 24px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
        scroll-behavior: smooth;
    }

    .doc-section {
        display: none;
    }

    .doc-section.active {
        display: block;
    }

    /* Content Cards */
    .section-card {
        padding: 16px;
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        margin-bottom: 12px;
        box-shadow: var(--shadow-sm);
        scroll-margin-top: 16px;
    }

    .section-card h2 {
        font-size: 13px;
        color: var(--text-primary);
        margin: 0 0 8px 0;
        font-weight: 700;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 6px;
        scroll-margin-top: 16px;
    }

    .section-card h3 {
        font-size: 11px;
        color: var(--accent-blue);
        margin: 14px 0 4px 0;
        font-weight: 700;
        scroll-margin-top: 16px;
    }

    .section-card p,
    .section-card li {
        font-size: 11px;
        line-height: 1.6;
        color: var(--text-secondary);
    }

    .section-card ul,
    .section-card ol {
        margin: 6px 0;
        padding-left: 18px;
    }

    .callout {
        margin: 12px 0 16px;
        padding: 10px 12px;
        border-left: 4px solid var(--accent-blue);
        border-radius: var(--radius-sm);
        background: #f8fbff;
        color: var(--text-primary);
        font-size: 11px;
        line-height: 1.6;
        box-shadow: var(--shadow-sm);
    }

    .callout-warning {
        border-left-color: #d97706;
        background: #fffaf0;
    }

    .callout-info {
        border-left-color: var(--accent-blue);
        background: #f0f7ff;
    }

    .feature-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(180px, 1fr));
        gap: 10px;
        margin: 12px 0 18px;
    }

    .feature-item {
        padding: 10px 12px;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-sm);
        background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
        box-shadow: var(--shadow-sm);
    }

    .feature-item strong {
        display: block;
        margin: 6px 0 4px;
        font-size: 11px;
        color: var(--text-primary);
    }

    .feature-item p {
        margin: 0;
        color: var(--text-secondary);
    }

    .feature-pill {
        display: inline-block;
        padding: 2px 6px;
        border-radius: 999px;
        background: var(--tree-active);
        color: var(--accent-blue);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.4px;
        text-transform: uppercase;
    }

    /* Code Blocks */
    code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10px;
        background: #f1f5f9;
        color: var(--accent-blue);
        padding: 2px 4px;
        border-radius: 3px;
        border: 1px solid #e2e8f0;
    }

    pre code {
        display: block;
        padding: 10px;
        overflow-x: auto;
        white-space: pre;
        color: var(--text-primary);
        line-height: 1.4;
    }

    a {
        color: var(--accent-blue);
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
    }
</style>
