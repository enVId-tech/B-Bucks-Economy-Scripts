<style>
    /* Student portal. Colours are variables so the dark theme only has to swap them. */
    :root {
        --portal-bg: #f3f6f9;
        --portal-surface: #ffffff;
        --portal-surface-alt: #eaf0f5;
        --portal-text: #14232f;
        --portal-muted: #5d7080;
        --portal-border: #d6e0e8;
        --portal-accent: #0f7b6c;
        --portal-accent-strong: #0a5c51;
        --portal-accent-soft: #d9f1ed;
        --portal-warn: #b25e09;
        --portal-warn-soft: #fdeed9;
        --portal-bad: #b3261e;
        --portal-bad-soft: #fbe3e1;
        --portal-good: #1d7a3a;
        --portal-shadow: 0 1px 2px rgba(20, 35, 47, 0.06), 0 6px 18px rgba(20, 35, 47, 0.06);
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --portal-bg: #0e171e;
            --portal-surface: #16232d;
            --portal-surface-alt: #1d2f3c;
            --portal-text: #e8f0f5;
            --portal-muted: #93a9b8;
            --portal-border: #2a3f4f;
            --portal-accent: #3fc1ad;
            --portal-accent-strong: #66d6c4;
            --portal-accent-soft: #14423c;
            --portal-warn: #f0a85a;
            --portal-warn-soft: #3b2c14;
            --portal-bad: #f28b82;
            --portal-bad-soft: #3d1c1a;
            --portal-good: #6fd48a;
            --portal-shadow: none;
        }
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        background: var(--portal-bg);
        color: var(--portal-text);
        font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 15px;
        line-height: 1.45;
    }

    .portal-header {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 20px;
        background: var(--portal-surface);
        border-bottom: 1px solid var(--portal-border);
    }

    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
    .brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--portal-accent); color: #fff; display: grid; place-items: center; font-size: 16px; }
    .header-user { display: flex; align-items: center; gap: 10px; color: var(--portal-muted); font-size: 13px; }
    .header-user select { max-width: 200px; }

    .portal-main { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }

    .tab-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 18px; }
    .tab-button {
        border: 1px solid var(--portal-border);
        background: var(--portal-surface);
        color: var(--portal-muted);
        padding: 9px 16px;
        border-radius: 999px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
    }
    .tab-button.active { background: var(--portal-accent); border-color: var(--portal-accent); color: #fff; }

    .card {
        background: var(--portal-surface);
        border: 1px solid var(--portal-border);
        border-radius: 14px;
        padding: 18px;
        box-shadow: var(--portal-shadow);
        margin-bottom: 16px;
    }
    .card h2 { margin: 0 0 12px; font-size: 16px; }
    .card h3 { margin: 16px 0 8px; font-size: 14px; color: var(--portal-muted); }

    .hero { background: linear-gradient(135deg, var(--portal-accent-strong), var(--portal-accent)); color: #fff; border: 0; }
    .hero-label { opacity: 0.85; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; }
    .hero-amount { font-size: 40px; font-weight: 700; margin: 4px 0; }
    .hero-sub { opacity: 0.9; font-size: 14px; }

    .grid { display: grid; gap: 14px; }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    @media (max-width: 720px) { .grid-2 { grid-template-columns: 1fr; } .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .hero-amount { font-size: 32px; } }

    .tile { background: var(--portal-surface-alt); border-radius: 12px; padding: 12px 14px; }
    .tile-label { color: var(--portal-muted); font-size: 12px; }
    .tile-value { font-size: 20px; font-weight: 700; margin-top: 2px; }

    label { display: block; font-size: 13px; font-weight: 600; color: var(--portal-muted); margin: 10px 0 4px; }
    input, select {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--portal-border);
        border-radius: 10px;
        background: var(--portal-surface);
        color: var(--portal-text);
        font: inherit;
    }
    input:focus, select:focus, button:focus-visible { outline: 2px solid var(--portal-accent); outline-offset: 1px; }
    input[readonly] { background: var(--portal-surface-alt); }

    .button {
        border: 0;
        border-radius: 10px;
        padding: 10px 16px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        background: var(--portal-accent);
        color: #fff;
    }
    .button:hover:not(:disabled) { background: var(--portal-accent-strong); }
    .button:disabled { opacity: 0.5; cursor: not-allowed; }
    .button-secondary { background: var(--portal-surface-alt); color: var(--portal-text); }
    .button-secondary:hover:not(:disabled) { background: var(--portal-border); }
    .button-danger { background: var(--portal-bad); }
    .button-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

    .list-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--portal-border); }
    .list-row:last-child { border-bottom: 0; }
    .row-title { font-weight: 600; }
    .row-sub { color: var(--portal-muted); font-size: 13px; }
    .row-actions { display: flex; align-items: center; gap: 8px; }
    .row-actions input { width: 70px; }
    .amount-plus { color: var(--portal-good); font-weight: 700; white-space: nowrap; }
    .amount-minus { color: var(--portal-bad); font-weight: 700; white-space: nowrap; }

    .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--portal-surface-alt); color: var(--portal-muted); }
    .badge-pending { background: var(--portal-warn-soft); color: var(--portal-warn); }
    .badge-approved { background: var(--portal-accent-soft); color: var(--portal-good); }
    .badge-denied, .badge-cancelled { background: var(--portal-bad-soft); color: var(--portal-bad); }

    .notice { padding: 11px 14px; border-radius: 10px; margin-bottom: 14px; background: var(--portal-surface-alt); }
    .notice-warn { background: var(--portal-warn-soft); color: var(--portal-warn); }
    .notice-good { background: var(--portal-accent-soft); color: var(--portal-good); }
    .notice-bad { background: var(--portal-bad-soft); color: var(--portal-bad); }
    .spectate-banner { background: var(--portal-warn-soft); color: var(--portal-warn); padding: 10px 20px; text-align: center; font-weight: 600; }

    .rank { width: 34px; font-weight: 700; color: var(--portal-muted); }
    .rank-you { background: var(--portal-accent-soft); border-radius: 10px; padding-left: 8px; padding-right: 8px; }

    .center-card { max-width: 460px; margin: 12vh auto; text-align: center; }
    .center-card h1 { margin: 8px 0; font-size: 22px; }
    .center-card p { color: var(--portal-muted); }
    .spinner { width: 28px; height: 28px; border: 3px solid var(--portal-border); border-top-color: var(--portal-accent); border-radius: 50%; animation: portal-spin 0.8s linear infinite; margin: 0 auto 12px; }
    @keyframes portal-spin { to { transform: rotate(360deg); } }

    .empty { color: var(--portal-muted); text-align: center; padding: 18px 0; }
    .tab-panel { animation: portal-fade 0.15s ease-out; }
    @keyframes portal-fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .tab-panel, .spinner { animation: none; } }
</style>
