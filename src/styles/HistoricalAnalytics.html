<!-- This file contains the HTML styles for the Historical Analytics page of the B-Bucks Economy Scripts project, providing a modernized light-theme interface for analyzing historical economic data. -->

<style>
    :root {
        --bg-main: #f8fafc;
        --bg-card: #ffffff;
        --border-color: #e2e8f0;
        --border-focus: #0366d6;
        --text-primary: #0f172a;
        --text-secondary: #64748b;
        --text-label: #475569;
        --accent-blue: #0366d6;
        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        --radius-md: 8px;
        --radius-sm: 5px;
    }

    * {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        box-sizing: border-box;
        user-select: none;
    }

    input, select, button {
        user-select: text;
    }

    body {
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100vw;
        background: var(--bg-main);
        color: var(--text-primary);
        overflow: hidden;
        font-size: 12px;
    }

    /* Navigation Header Bar */
    .nav-header {
        background: var(--bg-card);
        border-bottom: 1px solid var(--border-color);
        display: flex;
        gap: 4px;
        padding: 6px 12px;
        overflow-x: auto;
        box-shadow: var(--shadow-sm);
        z-index: 20;
    }

    .nav-link {
        padding: 6px 12px;
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 11px;
        font-weight: 500;
        text-decoration: none;
        transition: all 0.15s ease;
        white-space: nowrap;
        flex-shrink: 0;
    }

    .nav-link:hover {
        color: var(--text-primary);
        background: #f1f5f9;
    }

    .nav-link.active {
        color: #ffffff;
        background: var(--accent-blue);
        font-weight: 600;
        box-shadow: 0 2px 4px rgba(3, 102, 214, 0.2);
    }

    /* Main Container */
    .main-content {
        display: flex;
        flex-direction: column;
        flex: 1;
        overflow: hidden;
        width: 100vw;
        padding: 12px 16px;
        gap: 10px;
    }

    /* Header Container */
    .header-bar {
        background: var(--bg-card);
        padding: 10px 14px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow-sm);
    }

    .header-title {
        font-weight: 700;
        font-size: 15px;
        color: var(--text-primary);
        margin: 0;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .header-subtitle {
        font-size: 11px;
        color: var(--text-secondary);
        margin: 2px 0 0 0;
    }

    /* Controls Panel - Tight Single Row Configuration */
    .controls-panel {
        background: var(--bg-card);
        padding: 10px 14px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow-sm);
        display: flex;
        flex-direction: row;
        align-items: flex-end;
        gap: 12px;
        overflow-x: auto; /* Gracefully scrolls if screen width is constrained */
        white-space: nowrap;
    }

    .control-group {
        display: inline-flex;
        flex-direction: column;
        gap: 4px;
        flex: 0 0 auto; /* Keeps elements constrained strictly to content width */
    }

    .control-group label {
        font-size: 10px;
        font-weight: 700;
        color: var(--text-label);
        text-transform: uppercase;
        letter-spacing: 0.4px;
    }

    /* Content-fit sizing for multi-select and select boxes */
    select[multiple] {
        height: 76px;
        min-width: 170px;
        width: auto;
        padding: 2px;
    }

    select[multiple] option {
        padding: 3px 6px;
        border-radius: 3px;
        margin-bottom: 1px;
    }

    select[multiple] option:checked {
        background: var(--accent-blue) linear-gradient(0deg, var(--accent-blue) 0%, var(--accent-blue) 100%);
        color: #ffffff;
    }

    /* Fit-to-text width for inputs & standard dropdowns */
    input[type="date"], select:not([multiple]) {
        width: auto;
        min-width: 130px;
        padding: 6px 10px;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-sm);
        font-size: 12px;
        background: #ffffff;
        color: var(--text-primary);
        transition: all 0.15s ease;
    }

    input:focus, select:focus {
        outline: none;
        border-color: var(--border-focus);
        box-shadow: 0 0 0 2px rgba(3, 102, 214, 0.15);
    }

    /* Reset Button */
    .btn-reset {
        color: var(--text-primary);
        background: #f8fafc;
        background-image: linear-gradient(-180deg, #ffffff 0%, #f1f5f9 100%);
        border: 1px solid var(--border-color);
        padding: 6px 14px;
        border-radius: var(--radius-sm);
        font-weight: 600;
        cursor: pointer;
        font-size: 12px;
        transition: all 0.15s ease;
        height: 31px;
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .btn-reset:hover {
        background: #f1f5f9;
        border-color: #cbd5e1;
    }

    /* Main Chart Canvas Card */
    .chart-card {
        background: var(--bg-card);
        border-radius: var(--radius-md);
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow-md);
        flex: 1;
        display: flex;
        flex-direction: column;
        position: relative;
        padding: 14px;
        overflow: hidden;
    }

    .chart-wrapper {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 280px;
    }

    /* Loading Overlay */
    .loading-overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(2px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        z-index: 30;
        border-radius: var(--radius-md);
        color: var(--text-secondary);
        font-size: 12px;
    }

    .loading-spinner {
        width: 24px;
        height: 24px;
        border: 2.5px solid var(--border-color);
        border-top: 2.5px solid var(--accent-blue);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>
