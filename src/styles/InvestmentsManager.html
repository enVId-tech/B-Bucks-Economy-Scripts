<!-- Modernized HTML Styles for Investments Manager -->

<style>
  :root {
    --bg-main: #f8fafc;
    --bg-card: #ffffff;
    --border-color: #e2e8f0;
    --border-hover: #cbd5e1;
    --border-focus: #0366d6;
    --text-primary: #0f172a;
    --text-secondary: #64748b;
    --text-muted: #94a3b8;
    --accent-blue: #0366d6;
    --accent-blue-hover: #0256b8;
    --accent-green: #16a34a;
    --accent-green-hover: #15803d;
    --accent-red: #dc2626;
    --accent-red-hover: #b91c1c;
    --accent-purple: #6f42c1;
    --accent-purple-hover: #5a32a3;
    --accent-amber: #d97706;
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    --radius-md: 8px;
    --radius-sm: 5px;
  }

  * {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    box-sizing: border-box;
    user-select: none;
  }

  input[type="text"],
  input[type="number"],
  select {
    user-select: text;
  }

  body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg-main);
    font-size: 12px;
    color: var(--text-primary);
  }

  /* Top Navigation Header */
  /* Top Navigation Header */
  .nav-header {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    /* Aligns items nicely vertically */
    gap: 4px;
    padding: 6px 12px;
    overflow-x: auto;
    height: 48px;
    /* Explicit fixed height */
    flex-shrink: 0;
    /* Prevents Flexbox from compressing the header */
    box-shadow: var(--shadow-sm);
    z-index: 20;
  }

  .nav-link {
    padding: 6px 12px;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 11px;
    font-weight: 500;
    text-decoration: none;
    transition: all 0.15s ease;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .nav-link:hover {
    color: var(--text-primary);
    background: #f1f5f9;
  }

  .nav-link.active {
    color: #ffffff;
    background: var(--accent-blue);
    font-weight: 600;
    box-shadow: 0 2px 4px rgba(3, 102, 214, 0.2);
  }

  /* Main Content Split Layout */
  .main-content {
    display: flex;
    width: 100%;
    height: calc(100vh - 48px);
  }

  .left-panel,
  .right-panel {
    width: 50%;
    height: 100%;
    padding: 12px;
    overflow-y: auto;
    overflow-x: hidden;
  }

  .left-panel {
    border-right: 1px solid var(--border-color);
    background: var(--bg-main);
  }

  .right-panel {
    background: var(--bg-main);
    border-left: 1px solid var(--border-color);
  }

  /* Section Headers */
  .section-title {
    font-weight: 700;
    font-size: 13px;
    color: var(--accent-purple);
    border-bottom: 2px solid var(--accent-purple);
    padding-bottom: 6px;
    margin: 0 0 10px 0;
    display: flex;
    align-items: center;
  }

  .section-title::before {
    content: "💎";
    margin-right: 6px;
    font-size: 12px;
  }

  /* Cards & Form Panels */
  .form-section,
  .calc-section {
    background: var(--bg-card);
    padding: 10px 12px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-sm);
    margin-bottom: 8px;
  }

  .calc-section {
    background: var(--bg-card);
  }

  .form-title,
  .calc-title {
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }

  label {
    display: block;
    font-size: 9px;
    color: var(--text-secondary);
    font-weight: 700;
    text-transform: uppercase;
    margin: 6px 0 3px 0;
    letter-spacing: 0.4px;
  }

  label:first-of-type {
    margin-top: 0;
  }

  input,
  select {
    width: 100%;
    padding: 6px 10px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    font-size: 11px;
    background: #ffffff;
    color: var(--text-primary);
    transition: all 0.15s ease;
  }

  input:focus,
  select:focus {
    border-color: var(--border-focus);
    outline: none;
    box-shadow: 0 0 0 2px rgba(3, 102, 214, 0.15);
  }

  /* Information & Status Boxes */
  .info-box,
  .deadline-box,
  .warning-box,
  .current-earnings {
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    margin: 6px 0;
    border-left: 3px solid var(--accent-purple);
    font-size: 10px;
  }

  .info-box {
    background: #f5f3ff;
    border-left-color: var(--accent-purple);
  }

  .info-label {
    font-size: 9px;
    color: var(--text-secondary);
    text-transform: uppercase;
    font-weight: 700;
    letter-spacing: 0.4px;
  }

  .info-value {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-primary);
    margin-top: 2px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }

  .deadline-box {
    background: #fffbeb;
    border-left-color: var(--accent-amber);
    border: 1px solid #fef3c7;
    border-left-width: 3px;
    color: #b45309;
    display: none;
  }

  .deadline-label {
    font-size: 9px;
    color: #b45309;
    text-transform: uppercase;
    font-weight: 700;
    letter-spacing: 0.4px;
  }

  .deadline-value {
    font-size: 12px;
    color: var(--accent-red);
    font-weight: 700;
    margin-top: 2px;
  }

  .warning-box {
    background: #fffbeb;
    border-left-color: var(--accent-amber);
    border: 1px solid #fef3c7;
    border-left-width: 3px;
    color: #b45309;
    display: none;
  }

  .error-box {
    background: #fef2f2;
    border-left: 3px solid var(--accent-red);
    border: 1px solid #fecaca;
    border-left-width: 3px;
    color: #991b1b;
    display: none;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    font-size: 10px;
    font-weight: 600;
  }

  .current-earnings {
    background: #f0fdf4;
    border-left-color: var(--accent-green);
    border: 1px solid #bbf7d0;
    border-left-width: 3px;
    display: none;
  }

  .earnings-summary {
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    margin-bottom: 8px;
  }

  .earnings-summary-label {
    font-size: 9px;
    color: #166534;
    text-transform: uppercase;
    font-weight: 700;
    letter-spacing: 0.4px;
    margin-bottom: 3px;
  }

  .earnings-summary-value {
    font-size: 16px;
    font-weight: 700;
    color: var(--accent-green);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }

  /* Projection & Weekly Lists */
  .projection-container,
  .week-breakdown {
    max-height: 350px;
    overflow-y: auto;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
  }

  .week-breakdown {
    max-height: 400px;
    margin-bottom: 8px;
  }

  .projection-item,
  .week-item {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    transition: background 0.15s ease;
  }

  .projection-item:hover,
  .week-item:hover {
    background: #f8fafc;
  }

  .projection-item:last-child,
  .week-item:last-child {
    border-bottom: none;
  }

  .projection-week {
    font-weight: 700;
    color: var(--accent-purple);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }

  .projection-amount {
    font-weight: 700;
    color: var(--accent-green);
    font-size: 11px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }

  .projection-rate {
    font-size: 9px;
    color: var(--text-secondary);
    margin-left: 4px;
  }

  .week-left {
    flex: 1;
  }

  .week-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent-blue);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    margin-bottom: 2px;
  }

  .week-rate {
    font-size: 9px;
    color: var(--text-secondary);
    background: #f1f5f9;
    padding: 2px 6px;
    border-radius: 3px;
    display: inline-block;
    margin-top: 2px;
  }

  .week-status {
    font-size: 8px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    padding: 2px 6px;
    border-radius: 999px;
    display: inline-block;
    margin-left: 4px;
  }

  .week-status.closed {
    background: #fef2f2;
    color: var(--accent-red);
    border: 1px solid #fecaca;
  }

  .week-status.active {
    background: #fffbeb;
    color: var(--accent-amber);
    border: 1px solid #fef3c7;
  }

  .week-right {
    text-align: right;
    margin-left: 8px;
    flex-shrink: 0;
  }

  .week-value {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent-green);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    line-height: 1.3;
  }

  /* Interactive Buttons */
  .btn {
    color: #ffffff;
    border: none;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    font-weight: 600;
    cursor: pointer;
    font-size: 11px;
    transition: all 0.15s ease;
    box-shadow: var(--shadow-sm);
    width: 100%;
    margin-top: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .btn:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }

  .btn:active:not(:disabled) {
    transform: translateY(0);
  }

  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .btn-primary {
    background: var(--accent-blue);
  }

  .btn-primary:hover:not(:disabled) {
    background: var(--accent-blue-hover);
  }

  .btn-deposit {
    background: var(--accent-green);
  }

  .btn-deposit:hover:not(:disabled) {
    background: var(--accent-green-hover);
  }

  .btn-withdraw {
    background: var(--accent-red);
  }

  .btn-withdraw:hover:not(:disabled) {
    background: var(--accent-red-hover);
  }

  .btn-refresh {
    background: var(--accent-purple);
  }

  .btn-refresh:hover:not(:disabled) {
    background: var(--accent-purple-hover);
  }

  .btn-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 6px;
  }

  /* Tab Switchers */
  .tab-container {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }

  .tab-btn {
    flex: 1;
    padding: 6px 10px;
    border: 1px solid var(--border-color);
    background: var(--bg-card);
    color: var(--text-secondary);
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-weight: 600;
    font-size: 10px;
    transition: all 0.15s ease;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .tab-btn:hover:not(:disabled) {
    background: #f1f5f9;
    color: var(--text-primary);
  }

  .tab-btn.active {
    background: var(--accent-blue);
    color: #ffffff;
    border-color: var(--accent-blue);
    box-shadow: var(--shadow-sm);
  }

  .tab-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    background: #f1f5f9;
    color: var(--text-muted);
    border-color: var(--border-color);
  }

  /* Form Controls & Checkboxes */
  .checkbox-container {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 6px 0;
  }

  .checkbox-container input {
    width: auto;
    accent-color: var(--accent-blue);
    cursor: pointer;
  }

  .checkbox-container label {
    margin: 0;
    font-weight: normal;
    text-transform: none;
    font-size: 10px;
    color: var(--text-secondary);
    cursor: pointer;
  }

  .info-text {
    color: var(--text-secondary);
    line-height: 1.5;
    background: #f1f5f9;
    border: 1px solid var(--border-color);
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    margin: 6px 0;
    font-size: 10px;
  }

  /* Projection Success Container */
  .projection-success-box {
    display: none;
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    padding: 10px 12px;
    border-radius: var(--radius-md);
    margin-top: 10px;
  }

  .projection-success-label {
    font-size: 11px;
    color: #166534;
    font-weight: 700;
  }

  .projection-success-value {
    font-size: 15px;
    font-weight: 800;
    color: #15803d;
    margin-top: 4px;
  }

  /* Loading Indicators & Utility */
  .loading {
    opacity: 0.6;
  }

  .loading-indicator {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--bg-card);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-color);
    font-size: 11px;
    color: var(--text-secondary);
  }

  .loading-spinner {
    width: 16px;
    height: 16px;
    border: 2px solid var(--border-color);
    border-top: 2px solid var(--accent-blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    0% {
      transform: rotate(0deg);
    }

    100% {
      transform: rotate(360deg);
    }
  }

  .auto-refresh-indicator {
    font-size: 9px;
    color: var(--text-muted);
    text-align: center;
    padding: 4px;
    background: #f1f5f9;
    border-radius: var(--radius-sm);
    margin-top: 4px;
  }

  .auto-refresh-indicator.active {
    color: var(--accent-green);
    font-weight: 600;
  }

  /* Helper Utilities */
  .deadline-margin {
    margin-top: 8px;
  }

  .hidden-display {
    display: none;
  }

  .readonly-input {
    background: #f1f5f9;
    cursor: not-allowed;
    color: var(--text-secondary);
  }

  .current-earnings-detail {
    font-size: 11px;
    margin-top: 4px;
    color: #166534;
  }

  .margin-top-10 {
    margin-top: 10px;
  }

  .deposit-button-full {
    width: 100%;
    margin-top: 5px;
  }

  .hidden-margin {
    display: none;
    margin-top: 6px;
  }

  .btn-disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
</style>
