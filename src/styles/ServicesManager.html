<!-- Modernized HTML Styles for Services Manager -->

<style>
    :root {
        --bg-main: #f8fafc;
        --bg-card: #ffffff;
        --border-color: #e2e8f0;
        --border-hover: #cbd5e1;
        --border-focus: #0366d6;
        --text-primary: #0f172a;
        --text-secondary: #64748b;
        --text-muted: #94a3b8;
        --accent-blue: #0366d6;
        --accent-blue-hover: #0256b8;
        --accent-green: #16a34a;
        --accent-green-hover: #15803d;
        --accent-red: #dc2626;
        --accent-red-hover: #b91c1c;
        --accent-amber: #d97706;
        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        --radius-md: 8px;
        --radius-sm: 5px;
    }

    * {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        box-sizing: border-box;
        user-select: none;
    }

    input,
    select {
        user-select: text;
    }

    body {
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        background: var(--bg-main);
        overflow: hidden;
        font-size: 12px;
        color: var(--text-primary);
    }

    /* Navigation Header */
    .nav-header {
        background: var(--bg-card);
        border-bottom: 1px solid var(--border-color);
        display: flex;
        gap: 4px;
        padding: 6px 12px;
        overflow-x: auto;
        box-shadow: var(--shadow-sm);
        z-index: 20;
    }

    .nav-link {
        padding: 6px 12px;
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 11px;
        font-weight: 500;
        text-decoration: none;
        transition: all 0.15s ease;
        white-space: nowrap;
        flex-shrink: 0;
    }

    .nav-link:hover {
        color: var(--text-primary);
        background: #f1f5f9;
    }

    .nav-link.active {
        color: #ffffff;
        background: var(--accent-blue);
        font-weight: 600;
        box-shadow: 0 2px 4px rgba(3, 102, 214, 0.2);
    }

    /* Main Container & Split Layout */
    .main-content {
        display: flex;
        flex: 1;
        overflow: hidden;
    }

    .controls {
        width: 50%;
        padding: 12px;
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow-y: auto;
        background: var(--bg-main);
    }

    .log-panel {
        width: 50%;
        padding: 12px;
        background: var(--bg-main);
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        border-left: 1px solid var(--border-color);
    }

    .section-divider {
        border-top: 1px solid var(--border-color);
        margin: 10px 0;
    }

    /* Card Panels & Typography */
    .card {
        background: var(--bg-card);
        padding: 10px 12px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow-sm);
    }

    .header-title {
        font-weight: 700;
        font-size: 12px;
        color: var(--text-primary);
        margin-bottom: 2px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
    }

    .header-subtitle {
        font-size: 10px;
        color: var(--text-secondary);
        margin-bottom: 4px;
    }

    .label {
        font-size: 9px;
        font-weight: 700;
        color: var(--text-secondary);
        margin-top: 6px;
        margin-bottom: 3px;
        display: block;
        text-transform: uppercase;
        letter-spacing: 0.4px;
    }

    /* Inputs & Select Elements */
    select,
    input[type="number"],
    input[type="text"] {
        width: 100%;
        padding: 6px 10px;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-sm);
        font-size: 11px;
        background: #ffffff;
        color: var(--text-primary);
        transition: all 0.15s ease;
    }

    select:focus,
    input[type="number"]:focus,
    input[type="text"]:focus {
        border-color: var(--border-focus);
        outline: none;
        box-shadow: 0 0 0 2px rgba(3, 102, 214, 0.15);
    }

    /* Balance & Indicators */
    .balance-display {
        background: #f1f5f9;
        padding: 8px;
        border-radius: var(--radius-sm);
        text-align: center;
        border: 1px solid var(--border-color);
    }

    .balance-label {
        font-size: 9px;
        color: var(--text-secondary);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.4px;
    }

    .balance-amount {
        font-size: 15px;
        font-weight: 700;
        color: var(--text-primary);
        margin-top: 2px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .balance-amount.negative {
        color: var(--accent-red);
    }

    .balance-amount.positive {
        color: var(--accent-green);
    }

    /* Override Toggle Box */
    .toggle-container {
        display: flex;
        align-items: center;
        gap: 6px;
        background: #fffbeb;
        padding: 6px 10px;
        border-radius: var(--radius-sm);
        border: 1px solid #fef3c7;
    }

    .toggle-container input[type="checkbox"] {
        width: auto;
        cursor: pointer;
        accent-color: var(--accent-amber);
    }

    .toggle-label {
        font-size: 10px;
        color: #b45309;
        font-weight: 600;
        cursor: pointer;
    }

    .insufficient-warning {
        background: #fef2f2;
        color: #991b1b;
        padding: 6px;
        border-radius: var(--radius-sm);
        border: 1px solid #fecaca;
        font-size: 10px;
        text-align: center;
        font-weight: 600;
    }

    /* Live Preview Container */
    .preview-container {
        background: #eff6ff;
        border: 1px solid #bfdbfe;
        padding: 8px;
        border-radius: var(--radius-sm);
        margin: 6px 0;
    }

    .preview-text {
        font-size: 11px;
        color: var(--text-primary);
        font-weight: 600;
        text-align: center;
        line-height: 1.4;
    }

    .student-highlight {
        color: var(--accent-green);
        font-size: 12px;
        font-weight: 700;
    }

    .item-highlight {
        color: var(--accent-blue);
        font-weight: 700;
    }

    /* Submit Action Buttons */
    .btn-submit {
        color: #ffffff;
        border: none;
        padding: 8px 12px;
        width: 100%;
        border-radius: var(--radius-sm);
        font-weight: 600;
        font-size: 11px;
        cursor: pointer;
        transition: all 0.15s ease;
        box-shadow: var(--shadow-sm);
    }

    .btn-income {
        background: var(--accent-green);
    }

    .btn-income:hover:not(:disabled) {
        background: var(--accent-green-hover);
    }

    .btn-spending {
        background: var(--accent-red);
    }

    .btn-spending:hover:not(:disabled) {
        background: var(--accent-red-hover);
    }

    .btn-submit:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: var(--shadow-md);
    }

    .btn-submit:active:not(:disabled) {
        transform: translateY(0);
    }

    .btn-submit:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    /* Logs Section */
    .log-header {
        font-weight: 700;
        font-size: 13px;
        color: var(--accent-blue);
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 6px;
        margin-bottom: 8px;
    }

    .action-bar,
    .log-action-bar {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
        padding: 8px 10px;
        background: var(--bg-card);
        border-radius: var(--radius-md);
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow-sm);
    }

    .action-bar-section {
        flex: 1;
    }

    .action-bar-label {
        font-size: 9px;
        color: var(--text-secondary);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        display: block;
        margin-bottom: 3px;
    }

    .action-bar-input {
        width: 100%;
        padding: 5px 6px;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-sm);
        font-size: 11px;
    }

    .btn-undo-selected {
        padding: 6px 12px;
        background: var(--accent-red);
        color: #ffffff;
        border: none;
        border-radius: var(--radius-sm);
        font-weight: 600;
        font-size: 11px;
        cursor: pointer;
        transition: all 0.15s ease;
        box-shadow: var(--shadow-sm);
        white-space: nowrap;
    }

    .btn-undo-selected:hover:not(:disabled) {
        background: var(--accent-red-hover);
        transform: translateY(-1px);
        box-shadow: var(--shadow-md);
    }

    .btn-undo-selected:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    #log-container {
        flex: 1;
        overflow-y: auto;
        padding-right: 2px;
    }

    .log-item {
        padding: 10px;
        margin-bottom: 6px;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        background: var(--bg-card);
        box-shadow: var(--shadow-sm);
        display: flex;
        gap: 8px;
        align-items: flex-start;
        cursor: pointer;
        transition: all 0.15s ease;
    }

    .log-item:hover {
        background: #f8fafc;
        border-color: var(--border-hover);
    }

    .log-item.selected {
        background: #f0f7ff;
        border-color: #93c5fd;
        box-shadow: inset 3px 0 0 var(--accent-blue);
    }

    .log-item-content {
        flex: 1;
    }

    .log-item-header {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-bottom: 4px;
    }

    .log-item-name {
        font-weight: 700;
        font-size: 11px;
        color: var(--text-primary);
    }

    .log-item-id {
        display: inline-block;
        color: var(--accent-blue);
        background: #eff6ff;
        border: 1px solid #bfdbfe;
        border-radius: 3px;
        padding: 1px 5px;
        font-size: 9.5px;
        font-weight: 700;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        letter-spacing: 0.2px;
    }

    .log-item-period {
        margin-left: auto;
        padding: 2px 6px;
        border-radius: 999px;
        font-size: 8.5px;
        font-weight: 700;
        letter-spacing: 0.2px;
        color: #0284c7;
        background: #e0f2fe;
        border: 1px solid #bae6fd;
    }

    .log-item-type {
        margin: 2px 0;
    }

    .log-item-type-label {
        margin: 0;
        font-size: 9px;
        line-height: 1.3;
    }

    .log-item-timestamp {
        color: var(--text-secondary);
    }

    .log-item-date {
        font-size: 9.5px;
        color: var(--text-muted);
        margin-left: auto;
    }

    .log-item-service {
        font-weight: 700;
        font-size: 11px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        color: var(--text-primary);
        line-height: 1.4;
    }

    .log-item-math {
        font-weight: 700;
        font-size: 11px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        color: var(--text-primary);
        line-height: 1.4;
    }

    .log-item-math-label,
    .log-item-service-label {
        font-size: 8.5px;
        color: var(--text-secondary);
        padding: 0;
        margin: 0;
    }

    .log-item-service-value {
        font-size: 11px;
        color: var(--text-primary);
        margin: 0;
        padding: 0;
    }

    .log-item-checkbox {
        display: none;
    }

    .override-badge {
        background: var(--accent-amber);
        color: #ffffff;
        padding: 1px 4px;
        border-radius: 3px;
        font-size: 8px;
        font-weight: 700;
        margin-left: 3px;
        display: inline-block;
    }

    .error-message {
        background: var(--accent-red);
        color: #ffffff;
        padding: 6px;
        border-radius: var(--radius-sm);
        margin: 4px 0;
        font-size: 10px;
        font-weight: 600;
    }

    .loading {
        opacity: 0.6;
    }

    /* Colors */
    .positive,
    .log-item-math.positive {
        color: var(--accent-green);
    }

    .negative,
    .log-item-math.negative {
        color: var(--accent-red);
    }

    .static {
        color: var(--text-primary);
    }

    /* Indicators & Spinners */
    .loading-indicator {
        display: none;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        background: var(--bg-card);
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-color);
        font-size: 11px;
        color: var(--text-secondary);
    }

    .loading-spinner {
        width: 16px;
        height: 16px;
        border: 2px solid var(--border-color);
        border-top: 2px solid var(--accent-blue);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
        0% {
            transform: rotate(0deg);
        }

        100% {
            transform: rotate(360deg);
        }
    }

    .auto-refresh-indicator {
        font-size: 9px;
        color: var(--text-muted);
        text-align: center;
        padding: 4px;
        background: #f1f5f9;
        border-radius: var(--radius-sm);
        margin-top: 4px;
    }

    .auto-refresh-indicator.active {
        color: var(--accent-green);
        font-weight: 600;
    }

    /* Utility Classes */
    .card-margin-top-6 {
        margin-top: 6px;
    }

    .header-title-reset {
        margin: 0 0 4px 0;
    }

    .header-subtitle-margin {
        margin-bottom: 4px;
    }

    .margin-top-4 {
        margin-top: 4px;
    }

    .balance-display-margin {
        margin: 6px 0;
    }

    .toggle-margin-4 {
        margin: 4px 0;
    }

    .hidden-display {
        display: none;
    }

    .disabled {
        opacity: 0.5 !important;
        cursor: not-allowed !important;
    }
</style>
