<!-- This file contains the HTML structure for the Accounting Manager, which allows users to manually adjust B-Bucks balances, view transaction logs, and perform quick math operations on selected cells. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounting Manager</title>

    <!-- For contributors: Ignore these warning, this is a syntax issue with VSC not recognizing the server-side templating -->
    <!-- These lines MUST be included for the application to function correctly -->
    <?!= include('styles/BalanceManager'); ?>

    <!-- Include Client-to-Server HTML Utility to neatly transfer data between client and server through a JSON string -->
    <?!= include('utils/ClientToServer'); ?>

    <!-- Include Caching Layer Utility for efficient client-side data management -->
    <!-- IMPORTANT!!!1!1!1!1!! The import for the cache file MUST come AFTER the Client-to-Server utility, CachingLayer.html uses functions from it -->
    <?!= include('utils/CachingLayer'); ?>
</head>

<body>
    <!-- Navigation Header -->
    <div class="nav-header">
        <button class="nav-link active" onclick="callServer('openManualBalanceManager')">💰 Manual B-Bucks
            Modifier</button>
        <button class="nav-link" onclick="callServer('openIncomesExpenses')">💸 Income / Expenses</button>
        <button class="nav-link" onclick="callServer('openInvestmentsManager')">📈 Investment
            Banking</button>
        <button class="nav-link" onclick="callServer('openTransactionsRecords')">📊 Transaction
            Records</button>
        <button class="nav-link" onclick="callServer('openBankingSettings')">⚙️ Banking Settings</button>
    </div>

    <div class="main-content">
        <!-- Controls Panel -->
        <div class="controls">
            <!-- CARD 1: Quick Adjustments -->
            <div class="card">
                <div class="card-title">💰 Quick Adjustments</div>
                <div class="card-subtitle">Instant balance modifications</div>
                <div class="btn-group">
                    <button class="btn btn-add" onclick="applyValue('ADD', 1);">+1</button>
                    <button class="btn btn-remove" onclick="applyValue('SUBTRACT', 1);">-1</button>
                    <button class="btn btn-add" onclick="applyValue('ADD', 2);">+2</button>
                    <button class="btn btn-remove" onclick="applyValue('SUBTRACT', 2);">-2</button>
                    <button class="btn btn-add" onclick="applyValue('ADD', 5);">+5</button>
                    <button class="btn btn-remove" onclick="applyValue('SUBTRACT', 5);">-5</button>
                    <button class="btn btn-add" onclick="applyValue('ADD', 10);">+10</button>
                    <button class="btn btn-remove" onclick="applyValue('SUBTRACT', 10);">-10</button>
                </div>
            </div>

            <!-- CARD 2: Math Operations -->
            <div class="card">
                <div class="card-title">🧮 Multiply / Divide</div>
                <div class="card-subtitle">Scale balances by factor</div>
                <div class="btn-group">
                    <button class="btn btn-math" onclick="applyValue('MULTIPLY', 2);">×2</button>
                    <button class="btn btn-math" onclick="applyValue('DIVIDE', 2);">÷2</button>
                    <button class="btn btn-math" onclick="applyValue('MULTIPLY', 5);">×5</button>
                    <button class="btn btn-math" onclick="applyValue('DIVIDE', 5);">÷5</button>
                </div>
            </div>

            <!-- CARD 3: Custom Reason -->
            <div class="card">
                <div class="card-title">📝 Transaction Reason</div>
                <div class="card-subtitle">Optional note for activity log</div>
                <input type="text" id="transactionReason" placeholder="Enter reason for this transaction...">
            </div>

            <!-- CARD 4: Custom Input -->
            <div class="card">
                <div class="card-title">✏️ Custom Amount</div>
                <div class="card-subtitle">Manual entry with format support</div>
                <label for="customInput" class="section-label margin-top-6">Input</label>
                <input type="text" id="customInput" placeholder="Enter amount...">
                <button class="btn btn-add full-width margin-top-6" onclick="handleCustomInput()">Add
                    Custom Amount</button>
            </div>

            <!-- CARD 5: Format Guide -->
            <div class="card">
                <div class="card-title">📋 Input Format</div>
                <div class="guide guide-text">
                    <b>10</b> = add $10 | <b>-5</b> = subtract $5<br>
                    <b>*2</b> = double | <b>/4</b> = quarter
                </div>
            </div>

            <!-- CARD 6: History Control -->
            <div class="card card-margin-top-auto">
                <div class="card-title">📝 Log Display</div>
                <label for="logLimit" class="section-label">Recent
                    Entries</label>
                <input type="number" id="logLimit" value="25" min="1" class="full-width">
                <button class="btn btn-add full-width margin-top-6">Refresh Log</button>
            </div>
        </div>

        <!-- Activity Log Panel -->
        <div class="log-panel">
            <div class="log-header">Activity Log</div>

            <!-- Search & Filter Controls -->
            <div class="action-bar">
                <div class="action-bar-section">
                    <label class="action-bar-label">Search
                        Name</label>
                    <input type="text" id="logSearchName" placeholder="Search by name..." class="action-bar-input">
                </div>
                <div class="action-bar-section">
                    <label class="action-bar-label">Transaction
                        Date</label>
                    <input type="date" id="logFilterDate" class="action-bar-input">
                </div>
            </div>

            <!-- Undo Action Bar -->
            <div class="log-action-bar">
                <button class="btn-undo-selected" id="undoSelectedBtn" onclick="undoSelectedTransactions()" disabled>↶
                    Undo Selected</button>
            </div>

            <div id="log-container"></div>
        </div>
    </div>
    <script>
        let allTransactions = [];

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('logSearchName').addEventListener('input', applyTransactionFilters);
            document.getElementById('logFilterDate').addEventListener('change', applyTransactionFilters);

            // Handle click-to-select for all log items
            document.querySelectorAll('[data-selectable="true"]').forEach(item => {
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.classList.toggle('selected');
                    updateUndoButtonState();
                });
            });

            // Update undo button enabled state based on selected items
            function updateUndoButtonState() {
                const undoBtn = document.getElementById('undoSelectedBtn');
                const selectedItems = document.querySelectorAll('[data-selectable="true"].selected');
                undoBtn.disabled = selectedItems.length === 0;
            }

            // Deselect all when clicking outside
            document.addEventListener('click', () => {
                if (event.target === document.body || event.target === document.documentElement) {
                    document.querySelectorAll('[data-selectable="true"].selected').forEach(item => {
                        item.classList.remove('selected');
                    });
                    updateUndoButtonState();
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === "Enter") {
                    const activeElement = document.activeElement;
                    if (activeElement && activeElement.id === "customInput") {
                        handleCustomInput();
                    }
                }
            });

            loadTransactionData();
        })

        function normalizeFilterText(value) {
            return String(value ?? '').toLowerCase().trim();
        }

        function getFilteredTransactions() {
            const searchQuery = normalizeFilterText(document.getElementById('logSearchName').value);
            const filterDate = document.getElementById('logFilterDate').value;

            return allTransactions.filter(transaction => {
                const matchesName = !searchQuery || normalizeFilterText(transaction.individual).includes(searchQuery);
                const transactionDate = new Date(transaction.timestamp);
                const transactionDateValue = Number.isNaN(transactionDate.getTime()) ? '' : transactionDate.toLocaleDateString('en-CA');
                const matchesDate = !filterDate || transactionDateValue === filterDate;

                return matchesName && matchesDate;
            });
        }

        function renderTransactionLog(transactions) {
            const logContainer = document.getElementById('log-container');

            if (!transactions.length) {
                logContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔎</div>
                        <div>No transactions match the current filters.</div>
                    </div>
                `;
                updateUndoButtonState();
                return;
            }

            let htmlContent = '';

            transactions.slice().reverse().forEach(transaction => {
                const {
                    id,
                    individual,
                    period,
                    serviceProvided,
                    modifiedColumn,
                    initialColumnAmount,
                    newColumnAmount,
                    initialBalance,
                    newBalance,
                    timestamp
                } = transaction;

                const balanceDelta = Number((newBalance - initialBalance).toFixed(2));
                const balanceDeltaClass = balanceDelta < 0 ? 'negative' : balanceDelta > 0 ? 'positive' : 'static';
                const balanceDeltaSymbol = balanceDelta < 0 ? '-' : '+';

                const columnDelta = Number((newColumnAmount - initialColumnAmount).toFixed(2));
                const columnDeltaClass = columnDelta < 0 ? 'negative' : columnDelta > 0 ? 'positive' : 'static';
                const columnDeltaSymbol = columnDelta < 0 ? '-' : '+';

                const mathBalanceOperationElement = `
                    <span ${initialBalance < 0 ? 'class="negative"' : ''}>$${initialBalance}</span>
                    <span class="${balanceDeltaClass}">${balanceDeltaSymbol}</span>
                    <span class="${balanceDeltaClass}">$${Number(Math.abs(balanceDelta).toFixed(2))}</span> =
                    <span ${newBalance < 0 ? 'class="negative"' : ''}>$${newBalance}</span>
                `;

                const mathColumnOperationElement = `
                    <span ${initialColumnAmount < 0 ? 'class="negative"' : ''}>$${initialColumnAmount}</span>
                    <span class="${columnDeltaClass}">${columnDeltaSymbol}</span>
                    <span class="${columnDeltaClass}">$${Number(Math.abs(columnDelta).toFixed(2))}</span> =
                    <span ${newColumnAmount < 0 ? 'class="negative"' : ''}>$${newColumnAmount}</span>
                `;

                htmlContent += `
                    <div class="log-item" data-selectable="true" onclick="this.classList.toggle('selected'); updateUndoButtonState();">
                        <div class="log-item-content">
                            <div class="log-item-header">
                                <span class="log-item-name">${individual}</span>
                                <span class="log-item-period">Period ${period}</span>
                            </div>
                            <div class="log-item-type">
                                <p class="log-item-type-label log-item-timestamp">${new Date(timestamp).toLocaleString()}</p>
                            </div>
                            <div class="log-item-type">
                                <p class="log-item-type-label log-item-id">TXN#${id}</p>
                            </div>
                            <div class="log-item-service">
                                <p class="log-item-service-label">Service</p>
                                <p class="log-item-service-value">${serviceProvided}</p>
                            </div>
                            <div class="log-item-math">
                                <p class="log-item-math-label">Balance</p>
                                ${mathBalanceOperationElement}
                            </div>
                            <div class="log-item-math">
                                <p class="log-item-math-label">Col ${modifiedColumn}</p>
                                ${mathColumnOperationElement}
                            </div>
                        </div>
                    </div>
                `;
            });

            logContainer.innerHTML = htmlContent;
            updateUndoButtonState();
        }

        function applyTransactionFilters() {
            renderTransactionLog(getFilteredTransactions());
        }

        /**
         * Fetches transaction data from the server and populates the activity log. It handles errors gracefully and logs the last response for debugging purposes.
         */
        function loadTransactionData() {
            try {
                const logContainer = document.getElementById('log-container');
                logContainer.innerHTML = ''; // Clear existing entries

                callServer('fetchTransactionsDataCached', null, (res) => {
                    const response = JSON.parse(res);

                    if (response && Array.isArray(response)) {
                        allTransactions = response;
                        applyTransactionFilters();
                    } else {
                        console.error("Invalid response format from server.");
                    }
                }, (error) => {
                    console.error("Error fetching transaction data:", error);
                });
            } catch (err) {
                console.error("Error in loadTransactionData:", err);
            }
        }

        /**
         * Applies a balance modification based on the specified operation and amount. It validates the input, disables buttons during processing, and communicates with the server to execute the action. Error handling is included to manage invalid inputs and server errors gracefully.
         * @param {string} operation - The type of operation to perform (e.g.,
         * "ADD", "SUBTRACT", "MULTIPLY", "DIVIDE").
         * @param {number} amount - The amount to apply in the operation.
         */
        function applyValue(operation, amount) {
            try {
                const getButtons = document.querySelectorAll('.btn, .btn-math');

                getButtons.forEach(btn => btn.classList.add('disabled'));
                getButtons.forEach(btn => btn.disabled = true);

                if (!operation || !amount || typeof operation !== 'string' || isNaN(amount) || amount === 0) {
                    console.error("You must have an operation and an amount.");
                    getButtons.forEach(btn => btn.classList.remove('disabled'));
                    getButtons.forEach(btn => btn.disabled = false);
                    return;
                }

                const validOperations = ["ADD", "SUBTRACT", "MULTIPLY", "DIVIDE"];
                if (!validOperations.includes(operation)) {
                    console.error("Invalid operation: " + operation);
                    getButtons.forEach(btn => btn.classList.remove('disabled'));
                    getButtons.forEach(btn => btn.disabled = false);
                    return;
                }

                const transactionReason = document.getElementById('transactionReason').value;

                // Must stringify the payload to ensure consistent data format when sent to the server
                // Prevents an illegal value error
                const payload = JSON.stringify({
                    operation: operation,
                    unitPrice: amount,
                    quantity: 1,
                    transactionReason: transactionReason
                });

                callServer('executeBalanceAction', payload, (response) => {
                    console.log("Server Response:", response);
                    getButtons.forEach(btn => btn.classList.remove('disabled'));
                    getButtons.forEach(btn => btn.disabled = false);
                    // Refresh the log after applying the value
                    loadTransactionData();
                }, (error) => {
                    console.error("Server Error:", error);
                    getButtons.forEach(btn => btn.classList.remove('disabled'));
                    getButtons.forEach(btn => btn.disabled = false);
                });
            } catch (err) {
                console.error("Error in applyValue:", err);
                getButtons.forEach(btn => btn.classList.remove('disabled'));
                getButtons.forEach(btn => btn.disabled = false);
            }
        }

        /**
         * Handles the custom input submission, parsing the input for an optional operator and amount. It validates the format, determines the operation type, and applies the value accordingly. Error handling is included to manage invalid input formats gracefully.
         */
        function handleCustomInput() {
            try {
                const input = document.getElementById('customInput');
                const value = input.value.trim();
                if (!value) return;

                const match = value.match(/^([+\-*/])?\s*(\d+(\.\d{1,2})?)$/);
                if (!match) {
                    console.error("Invalid input format. Please enter a valid amount with an optional operator (+, -, *, /).");
                    throw new Error("Invalid input format. Please enter a valid amount with an optional operator (+, -, *, /).");
                }
                const operator = match[1] || "ADD";
                const amount = parseFloat(match[2]);
                let operation = {
                    "+": "ADD",
                    "-": "SUBTRACT",
                    "*": "MULTIPLY",
                    "/": "DIVIDE"
                }[operator] || "ADD";

                applyValue(operation, amount);
            } catch (err) {
                console.error("Error in handleCustomInput:", err);
            }
        }

        function updateUndoButtonState() {
            const undoBtn = document.getElementById('undoSelectedBtn');
            const selectedItems = document.querySelectorAll('[data-selectable="true"].selected');
            undoBtn.disabled = selectedItems.length === 0;
        }

        function undoSelectedTransactions() {
            const selectedItems = document.querySelectorAll('[data-selectable="true"].selected');
            if (selectedItems.length === 0) return;

            const transactionIds = Array.from(selectedItems).map(item => item.querySelector('.log-item-id').textContent.replace('TXN#', ''));

            console.log("Undoing Transactions:", transactionIds);

            callServer('undoTransactions', JSON.stringify({ transactionIds }), (response) => {
                if (response) {
                    console.log("Successfully undone transactions:", transactionIds);
                    // Refresh the log after undoing
                    loadTransactionData();
                } else {
                    console.error("Failed to undo transactions:", response.error);
                }
            }, (error) => {
                console.error("Error undoing transactions:", error);
            });
        }
    </script>
</body>

</html>
