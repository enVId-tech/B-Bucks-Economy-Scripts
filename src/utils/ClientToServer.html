<!-- This HTML file provides a utility function for client-side code to call server-side functions in Google Apps Script. It includes error handling and a fallback for local development. -->

<script>
    // Use to call server functions from client-side with optional success and failure handlers
    function callServer(serverFunctionName, data, onSuccess, onFailure) {
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            // Dynamically call the server function
            google.script.run
                .withSuccessHandler(onSuccess || function () { })
                .withFailureHandler(onFailure || function (err) { console.error(err.error || err); })[serverFunctionName](data);
        } else {
            // Local development fallback
            if (onSuccess) onSuccess("Mock Local Success Response");
        }
    }
</script>
